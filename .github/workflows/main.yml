name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build-apk-and-admin:

    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND ZIP AUTOMATICALLY
      # ============================================================

      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR PROJECT ZIP"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo ""
            echo "Repository files:"
            ls -lah
            echo ""
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT ZIP"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "EXTRACTION COMPLETE"
          echo ""

          find extracted -maxdepth 4 -type f | sort | head -300


      # ============================================================
      # 4. FIND ANDROID PROJECT
      # ============================================================

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING ANDROID PROJECT"
          echo "=========================================="

          PROJECT=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Gradle files:"
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" \) \
              -print

            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 6. GRADLE 8.0
      # ============================================================

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      # ============================================================
      # 7. ANDROIDX
      # ============================================================

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties || true
          sed -i '/^android.enableJetifier=/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "AndroidX enabled."


      # ============================================================
      # 8. FIX REPOSITORY MODE
      # ============================================================

      - name: Fix Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
          fi

          if [ -f settings.gradle.kts ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
          fi


      # ============================================================
      # 9. FIX COLOR SELECTOR
      # ============================================================

      - name: Fix Color Selector Resources
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/color

          if [ -f app/src/main/res/values/nav_colors.xml ]; then
            if grep -q "state_checked" app/src/main/res/values/nav_colors.xml; then
              mv app/src/main/res/values/nav_colors.xml \
                 app/src/main/res/color/nav_colors.xml
            fi
          fi


      # ============================================================
      # 10. FIX BUNDLE IMPORT
      # ============================================================

      - name: Fix Missing Bundle Imports
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "Checking Java files for Bundle..."

          find app/src/main/java \
            -type f \
            -name "*.java" \
            -print0 |
          while IFS= read -r -d '' FILE; do

            if grep -q "Bundle" "$FILE"; then

              if ! grep -q "^import android.os.Bundle;" "$FILE"; then

                echo "Adding Bundle import to:"
                echo "$FILE"

                sed -i \
                  '/^package .*;/a import android.os.Bundle;' \
                  "$FILE"

              fi

            fi

          done


      # ============================================================
      # 11. FIX JAVAX.XML.BIND ERROR
      # ============================================================

      - name: Fix javax.xml.bind DatatypeConverter
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "Searching for javax.xml.bind..."

          find app/src/main/java \
            -type f \
            -name "*.java" \
            -print0 |
          while IFS= read -r -d '' FILE; do

            if grep -q "javax.xml.bind.DatatypeConverter.parseDateTime" "$FILE"; then

              echo "Fixing:"
              echo "$FILE"

              sed -i \
                's/javax\.xml\.bind\.DatatypeConverter\.parseDateTime(s)\.getTimeInMillis()/java.time.OffsetDateTime.parse(s).toInstant().toEpochMilli()/g' \
                "$FILE"

            fi

          done

          echo "javax.xml.bind fix completed."


      # ============================================================
      # 12. FIX getCodeCache()
      # ============================================================

      - name: Fix getCodeCache
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "Searching for getCodeCache()..."

          find app/src/main/java \
            -type f \
            -name "*.java" \
            -print0 |
          while IFS= read -r -d '' FILE; do

            if grep -q "getCodeCache()" "$FILE"; then

              echo "Fixing:"
              echo "$FILE"

              sed -i 's/getCodeCache()/getCodeCacheDir()/g' "$FILE"

            fi

          done

          echo "getCodeCache fix completed."


      # ============================================================
      # 13. SHOW PROJECT
      # ============================================================

      - name: Project Verification
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          echo "=========================================="
          echo "PROJECT VERIFICATION"
          echo "=========================================="

          echo ""
          echo "JAVA VERSION:"
          java -version

          echo ""
          echo "GRADLE VERSION:"
          gradle --version

          echo ""
          echo "ANDROID PROJECT:"
          pwd

          echo ""
          echo "JAVA FILES:"
          find app/src/main/java \
            -type f \
            -name "*.java" \
            | sort

          echo ""
          echo "RESOURCE FILES:"
          find app/src/main/res \
            -type f \
            | sort | head -300


      # ============================================================
      # 14. CLEAN
      # ============================================================

      - name: Clean Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon


      # ============================================================
      # 15. BUILD APK
      # ============================================================

      - name: Build APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set +e

          echo "=========================================="
          echo "BUILDING SADEE X DIMA APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          echo "EXIT CODE: $RESULT"

          if [ "$RESULT" != "0" ]; then

            echo ""
            echo "=========================================="
            echo "JAVA COMPILER ERRORS"
            echo "=========================================="

            grep -n \
              -A20 \
              -B10 \
              "cannot find symbol" \
              build.log \
              | tail -300 || true

            echo ""
            echo "=========================================="
            echo "SYMBOL / LOCATION"
            echo "=========================================="

            grep -n \
              -A10 \
              -B5 \
              -E "symbol:|location:" \
              build.log \
              | tail -200 || true

            echo ""
            echo "=========================================="
            echo "ALL ERRORS"
            echo "=========================================="

            grep -n \
              -E "error:|cannot find symbol|symbol:|location:" \
              build.log \
              | tail -300 || true

            exit "$RESULT"

          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="


      # ============================================================
      # 16. LOCATE APK
      # ============================================================

      - name: Locate APK
        if: success()
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # 18. UPLOAD BUILD LOG
      # ============================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore


      # ============================================================
      # 19. FIND ADMIN DASHBOARD
      # ============================================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING ADMIN DASHBOARD"
          echo "=========================================="

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then

              echo "ERROR: Admin dashboard not found."

              echo ""
              echo "HTML files:"
              find extracted \
                -type f \
                -name "*.html" \
                | sort

              exit 1

            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo ""
          echo "ADMIN DASHBOARD:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 20. PREPARE ADMIN
      # ============================================================

      - name: Prepare Admin Dashboard
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "PREPARING ADMIN DASHBOARD"
          echo "=========================================="

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo ""
          echo "ADMIN FILES:"

          find public \
            -maxdepth 10 \
            -type f \
            | sort


      # ============================================================
      # 21. DEPLOY ADMIN TO GITHUB PAGES
      # ============================================================

      - name: Deploy Admin Dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
