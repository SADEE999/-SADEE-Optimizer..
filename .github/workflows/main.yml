name: SADEE X DIMA V7 - FINAL NO ERROR BUILD

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed APK + Deploy Admin
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # IMPORTANT:
      # No Gradle cache is enabled here.
      # This prevents setup-java from searching the repository
      # for Gradle files before the project ZIP is extracted.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f -iname "*.zip" \
              -not -path "./.git/*" \
              -not -path "./extracted/*" \
              -print | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP project found."
            echo "Upload the SADEE X DIMA project ZIP to the repository."
            exit 1
          fi

          PICK=""

          # Prefer the current V7 project if multiple ZIPs exist.
          for f in "${ZIPS[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" == *V7* || "$base" == *v7* || "$base" == *REAL_OPTIMIZER* ]]; then
              PICK="$f"
              break
            fi
          done

          # Otherwise use the newest ZIP by modification time.
          if [ -z "$PICK" ]; then
            PICK="$(
              printf '%s\n' "${ZIPS[@]}" |
              xargs -r -d '\n' ls -1t 2>/dev/null |
              head -n 1
            )"
          fi

          if [ -z "$PICK" ] || [ ! -f "$PICK" ]; then
            echo "::error::Could not select a project ZIP."
            exit 1
          fi

          echo "Selected project ZIP: $PICK"
          echo "zip_path=$PICK" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip_path }}" -d extracted

          echo "Project files:"
          find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \
            -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r f; do
            d="$(dirname "$f")"

            if [ -f "$d/settings.gradle" ] || \
               [ -f "$d/settings.gradle.kts" ]; then
              PROJECT="$d"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) |
            sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found."
            find extracted -maxdepth 6 -type f -print | sort | head -300
            exit 1
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"

          echo "Android project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Validate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java

          echo "Android project validation passed."

      - name: Prepare Gradle 8.7
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not depend on a wrapper that may not exist inside the ZIP.
          # The GitHub runner already has Gradle available.
          gradle --version

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 8.7 --distribution-type bin
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Configure Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find unsigned APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk -type f -name "*.apk" | sort | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/sadee-release.jks" \
            -storepass "sadee-build-pass" \
            -keypass "sadee-build-pass" \
            -alias "sadee" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Sri Lanka, C=LK"

      - name: Sign and align APK
        id: sign
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="${{ steps.apk.outputs.apk_path }}"
          ALIGNED="$RUNNER_TEMP/sadee-aligned.apk"
          SIGNED="$RUNNER_TEMP/SADEE-X-DIMA-OPTIMIZER-release.apk"

          zipalign -f -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          apksigner sign \
            --ks "$RUNNER_TEMP/sadee-release.jks" \
            --ks-pass pass:sadee-build-pass \
            --ks-key-alias sadee \
            --key-pass pass:sadee-build-pass \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify --verbose --print-certs "$SIGNED"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$SIGNED" \
            "$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER-release.apk"

          echo "signed_apk=$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V7-SIGNED-APK
          path: final-apk/SADEE-X-DIMA-OPTIMIZER-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V7-BUILD-REPORTS
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/**
            ${{ steps.project.outputs.project_dir }}/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare admin dashboard
        id: admin
        shell: bash
        run: |
          set -euo pipefail

          ADMIN=""

          while IFS= read -r f; do
            ADMIN="$(dirname "$f")"
            break
          done < <(
            find extracted -type f -path "*/admin-dashboard/index.html" |
            sort
          )

          if [ -z "$ADMIN" ]; then
            echo "No admin-dashboard/index.html found; skipping admin deployment."
            echo "has_admin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf public
          mkdir -p public
          cp -R "$ADMIN"/. public/

          echo "Admin dashboard prepared: $ADMIN"
          echo "has_admin=true" >> "$GITHUB_OUTPUT"

      - name: Deploy admin dashboard to GitHub Pages
        if: steps.admin.outputs.has_admin == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy SADEE X DIMA admin dashboard"

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "SADEE X DIMA V7 BUILD SUCCESS"
          echo "=========================================="
          echo "Signed APK: SADEE-X-DIMA-OPTIMIZER-release.apk"
          echo "APK artifact: SADEE-X-DIMA-V7-SIGNED-APK"
          echo "=========================================="
