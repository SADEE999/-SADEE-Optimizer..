name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build-apk-and-admin:

    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # FIND ZIP
      # =====================================================

      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING SADEE X DIMA ZIP"
          echo "=========================================="

          ZIP_FILE=""

          for f in ./*.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # =====================================================
      # EXTRACT
      # =====================================================

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "=========================================="
          echo "EXTRACTING ZIP"
          echo "=========================================="

          unzip -oq "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "EXTRACTED FILES:"
          find extracted -maxdepth 4 -type f | sort | head -300


      # =====================================================
      # FIND ANDROID PROJECT
      # =====================================================

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING ANDROID PROJECT"
          echo "=========================================="

          PROJECT=""

          while IFS= read -r settings; do

            DIR="$(dirname "$settings")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -type f | sort
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =====================================================
      # GRADLE
      # =====================================================

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      # =====================================================
      # ANDROIDX
      # =====================================================

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties || true
          sed -i '/^android.enableJetifier=/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "AndroidX enabled."


      # =====================================================
      # REPOSITORY MODE
      # =====================================================

      - name: Fix Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          if [ -f settings.gradle.kts ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

          fi


      # =====================================================
      # RESOURCE FIXES
      # =====================================================

      - name: Fix Resource Files
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/color

          if [ -f app/src/main/res/values/nav_colors.xml ]; then

            if grep -q "state_checked" \
              app/src/main/res/values/nav_colors.xml; then

              echo "Moving nav_colors.xml"

              mv \
                app/src/main/res/values/nav_colors.xml \
                app/src/main/res/color/nav_colors.xml

            fi

          fi


      # =====================================================
      # FIX JAVA SOURCE ERRORS
      # =====================================================

      - name: Fix Supabase Java 17 Compatibility
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set -e

          FILE="app/src/main/java/com/sadee/optimizer/Supabase.java"

          echo "=========================================="
          echo "FIXING SUPABASE JAVA"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "Supabase.java not found."
            exit 1
          fi

          echo ""
          echo "BEFORE:"
          grep -n \
            -E "parseIso|DatatypeConverter|java.time" \
            "$FILE" || true

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/sadee/optimizer/Supabase.java")

          s = p.read_text()

          old = '''    private static long parseIso(String s) {
        if (s == null || s.isEmpty()) return 0;
        try { return java.time.Instant.parse(s).toEpochMilli(); } catch (Exception e) {}
        try { return javax.xml.bind.DatatypeConverter.parseDateTime(s).getTimeInMillis(); } catch (Exception e) {}
        return 0;
    }'''

          new = '''    private static long parseIso(String s) {
        if (s == null || s.isEmpty()) return 0;

        String[] patterns = {
            "yyyy-MM-dd'T'HH:mm:ssXXX",
            "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
            "yyyy-MM-dd'T'HH:mm:ss'Z'",
            "yyyy-MM-dd HH:mm:ssXXX"
        };

        for (String pattern : patterns) {
            try {
                java.text.SimpleDateFormat f =
                    new java.text.SimpleDateFormat(pattern, java.util.Locale.US);

                f.setLenient(false);

                java.util.Date d = f.parse(s);

                if (d != null) {
                    return d.getTime();
                }

            } catch (Exception ignored) {}
        }

        return 0;
    }'''

          if old in s:
              s = s.replace(old, new)
          else:
              # Fallback: replace the whole method using boundaries.
              start = s.find("    private static long parseIso(String s)")
              end = s.find("\n    }\n}", start)

              if start != -1 and end != -1:
                  replacement = '''    private static long parseIso(String s) {
        if (s == null || s.isEmpty()) return 0;

        String[] patterns = {
            "yyyy-MM-dd'T'HH:mm:ssXXX",
            "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
            "yyyy-MM-dd'T'HH:mm:ss'Z'",
            "yyyy-MM-dd HH:mm:ssXXX"
        };

        for (String pattern : patterns) {
            try {
                java.text.SimpleDateFormat f =
                    new java.text.SimpleDateFormat(pattern, java.util.Locale.US);

                f.setLenient(false);

                java.util.Date d = f.parse(s);

                if (d != null) {
                    return d.getTime();
                }

            } catch (Exception ignored) {}
        }

        return 0;
    }'''

                  s = s[:start] + replacement + s[end+6:]

          # Absolute safety: never leave JAXB reference.
          s = s.replace(
              "try { return javax.xml.bind.DatatypeConverter.parseDateTime(s).getTimeInMillis(); } catch (Exception e) {}",
              ""
          )

          p.write_text(s)

          PY

          echo ""
          echo "AFTER:"
          grep -n \
            -E "parseIso|DatatypeConverter|java.time" \
            "$FILE" || true

          if grep -q "javax.xml.bind" "$FILE"; then
            echo "ERROR: JAXB reference still exists."
            exit 1
          fi

          echo "Supabase Java compatibility fixed."


      # =====================================================
      # FIX MAIN ACTIVITY
      # =====================================================

      - name: Fix MainActivity Cache Cleaner
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set -e

          FILE="app/src/main/java/com/sadee/optimizer/MainActivity.java"

          echo "=========================================="
          echo "FIXING MAINACTIVITY"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          echo ""
          echo "SEARCHING getCodeCache():"

          grep -n "getCodeCache" "$FILE" || true

          # Android-safe replacement.
          # getCacheDir() is sufficient for the app cache cleaner.
          sed -i \
            's/clearCache(getCacheDir()); clearCache(getCodeCache());/clearCache(getCacheDir());/' \
            "$FILE"

          # If formatting differs, remove any remaining getCodeCache call.
          sed -i \
            's/clearCache(getCodeCache());//g' \
            "$FILE"

          echo ""
          echo "AFTER:"

          grep -n "getCodeCache" "$FILE" || true

          if grep -q "getCodeCache()" "$FILE"; then
            echo "ERROR: getCodeCache() still exists."
            exit 1
          fi

          echo "MainActivity cache cleaner fixed."


      # =====================================================
      # PAGE 5 BUNDLE FIX
      # =====================================================

      - name: Fix Page5 Bundle Import
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set -e

          FILE="app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java"

          if [ -f "$FILE" ]; then

            if ! grep -q "^import android.os.Bundle;" "$FILE"; then

              sed -i \
                '/^package com\.sadee\.optimizer;/a import android.os.Bundle;' \
                "$FILE"

            fi

          fi


      # =====================================================
      # FINAL SOURCE CHECK
      # =====================================================

      - name: Verify Source Fixes
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFYING SOURCE"
          echo "=========================================="

          if grep -R \
            -n \
            "javax.xml.bind" \
            app/src/main/java; then

            echo "ERROR: javax.xml.bind still exists."
            exit 1

          fi

          if grep -R \
            -n \
            "getCodeCache()" \
            app/src/main/java; then

            echo "ERROR: getCodeCache() still exists."
            exit 1

          fi

          echo ""
          echo "SOURCE CHECK PASSED."


      # =====================================================
      # PROJECT DIAGNOSTICS
      # =====================================================

      - name: Project Diagnostics
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SOURCES"
          echo "=========================================="

          find app/src/main/java \
            -type f \
            -name "*.java" \
            | sort


      # =====================================================
      # CLEAN
      # =====================================================

      - name: Clean Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # =====================================================
      # BUILD
      # =====================================================

      - name: Build APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set +e

          echo "=========================================="
          echo "BUILDING SADEE X DIMA"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          echo "EXIT CODE: $RESULT"

          if [ "$RESULT" != "0" ]; then

            echo ""
            echo "=========================================="
            echo "ERRORS"
            echo "=========================================="

            grep -n \
              -A25 \
              -B10 \
              "error:" \
              build.log | tail -500 || true

            exit "$RESULT"

          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="


      # =====================================================
      # LOCATE APK
      # =====================================================

      - name: Locate APK
        if: success()
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # =====================================================
      # UPLOAD APK
      # =====================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-RELEASE
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # =====================================================
      # BUILD LOG
      # =====================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore


      # =====================================================
      # FIND ADMIN
      # =====================================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING ADMIN DASHBOARD"
          echo "=========================================="

          ADMIN=""

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | sort \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | sort \
              | head -n 1)

            if [ -n "$INDEX" ]; then
              ADMIN="$(dirname "$INDEX")"
            fi

          fi

          if [ -z "$ADMIN" ]; then

            echo "ERROR: Admin dashboard not found."

            find extracted \
              -type f \
              -name "*.html" \
              | sort

            exit 1

          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      # =====================================================
      # PREPARE ADMIN
      # =====================================================

      - name: Prepare Admin Dashboard
        shell: bash
        run: |

          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo "ADMIN READY"

          find public \
            -maxdepth 10 \
            -type f \
            | sort


      # =====================================================
      # DEPLOY ADMIN
      # =====================================================

      - name: Deploy Admin Dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
