name: SADEE X DIMA - AUTO BUILD FIXED

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build:
    name: Extract + Repair + Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1 CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================
      # 2 SHOW FILES
      # ==========================================

      - name: Show Repository
        run: |
          echo "======================================"
          echo "REPOSITORY"
          echo "======================================"

          find . \
            -maxdepth 4 \
            -type f \
            ! -path "./.git/*" \
            | sort


      # ==========================================
      # 3 FIND ZIP
      # ==========================================

      - name: Find ZIP
        shell: bash
        run: |

          echo "======================================"
          echo "SEARCHING ZIP"
          echo "======================================"

          ZIP_FILE=""

          while IFS= read -r FILE
          do
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$FILE"
            fi
          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then

            echo "❌ ZIP NOT FOUND"

            echo ""
            echo "Repository files:"

            find . \
              -maxdepth 3 \
              -type f \
              ! -path "./.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 4 TEST ZIP
      # ==========================================

      - name: Test ZIP
        run: |
          unzip -t "$ZIP_FILE"


      # ==========================================
      # 5 EXTRACT
      # ==========================================

      - name: Extract ZIP
        shell: bash
        run: |

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED"

          find extracted \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # ==========================================
      # 6 SETUP FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ==========================================
      # 7 DETECT PROJECT
      # ==========================================

      - name: Detect Flutter Project
        shell: bash
        run: |

          PROJECT_DIR=""

          while IFS= read -r PUBSPEC
          do

            DIR="$(dirname "$PUBSPEC")"

            if [ -d "$DIR/lib" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              | sort
          )


          # ------------------------------------------
          # If no Flutter project, create one
          # ------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo "No pubspec.yaml found."

            V6_FILE="$(
              find extracted \
                -type f \
                -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
                | head -n 1
            )"

            if [ -z "$V6_FILE" ]; then

              echo "❌ Flutter project not found."

              exit 1

            fi

            PROJECT_DIR="$GITHUB_WORKSPACE/generated_project"

            mkdir -p "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            flutter create . \
              --project-name sadee_x_dima_optimizer \
              --platforms=android

            mkdir -p lib/screens

            cp "$V6_FILE" \
              lib/screens/user_home_v6.dart

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "======================================"
          echo "PROJECT"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8 CHECK OLD ANDROID EMBEDDING
      # ==========================================

      - name: Detect Android V1 Embedding
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "CHECKING ANDROID EMBEDDING"
          echo "======================================"

          OLD_EMBEDDING=false


          # Old FlutterActivity
          if grep -Rqs \
            "io.flutter.app.FlutterActivity" \
            android \
            2>/dev/null; then

            echo "OLD FlutterActivity FOUND"

            OLD_EMBEDDING=true

          fi


          # Old FlutterApplication
          if grep -Rqs \
            "io.flutter.app.FlutterApplication" \
            android \
            2>/dev/null; then

            echo "OLD FlutterApplication FOUND"

            OLD_EMBEDDING=true

          fi


          # Old PluginRegistry
          if grep -Rqs \
            "PluginRegistry.Registrar" \
            android \
            2>/dev/null; then

            echo "OLD PluginRegistry FOUND"

            OLD_EMBEDDING=true

          fi


          # Old Flutter v1 metadata
          if grep -Rqs \
            "android:name=\"io.flutter.app.FlutterApplication\"" \
            android \
            2>/dev/null; then

            OLD_EMBEDDING=true

          fi


          if [ "$OLD_EMBEDDING" = "true" ]; then

            echo ""
            echo "⚠️ OLD ANDROID V1 EMBEDDING DETECTED"
            echo ""
            echo "Regenerating Android project..."
            echo ""

            echo "OLD_ANDROID=true" >> "$GITHUB_ENV"

          else

            echo "✅ No Android V1 embedding detected."

            echo "OLD_ANDROID=false" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 9 REPAIR ANDROID PROJECT
      # ==========================================

      - name: Repair Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [ "$OLD_ANDROID" = "true" ]; then

            echo "======================================"
            echo "REBUILDING ANDROID PROJECT"
            echo "======================================"

            rm -rf android

            flutter create . \
              --platforms=android \
              --project-name sadee_x_dima_optimizer

            echo ""
            echo "✅ NEW ANDROID PROJECT CREATED"

          else

            if [ ! -d "android" ]; then

              echo "Android folder missing."

              flutter create . \
                --platforms=android

            fi

          fi


      # ==========================================
      # 10 INSTALL V6 UI
      # ==========================================

      - name: Install V6 UI
        shell: bash
        run: |

          echo "======================================"
          echo "INSTALLING V6 UI"
          echo "======================================"

          V6_FILE=""

          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart" ]; then

            V6_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart"

          else

            V6_FILE="$(
              find extracted \
                -type f \
                -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
                | head -n 1
            )"

          fi


          if [ -n "$V6_FILE" ] && [ -f "$V6_FILE" ]; then

            mkdir -p "$PROJECT_DIR/lib/screens"

            cp "$V6_FILE" \
              "$PROJECT_DIR/lib/screens/user_home_v6.dart"

            echo "✅ V6 UI copied."

          fi


      # ==========================================
      # 11 CREATE MAIN
      # ==========================================

      - name: Create Main
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [ ! -f "lib/main.dart" ]; then

            cat > lib/main.dart <<'EOF'
import 'package:flutter/material.dart';
import 'screens/user_home_v6.dart';

void main() {
  runApp(const SadeeDimaApp());
}

class SadeeDimaApp extends StatelessWidget {
  const SadeeDimaApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'SADEE X DIMA OPTIMIZER',
      theme: ThemeData.dark(
        useMaterial3: true,
      ),
      home: const UserHomeScreen(),
    );
  }
}
EOF

          fi


      # ==========================================
      # 12 ANDROIDX
      # ==========================================

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          touch android/gradle.properties

          grep -q \
            "android.useAndroidX=true" \
            android/gradle.properties \
            || echo \
            "android.useAndroidX=true" \
            >> android/gradle.properties

          grep -q \
            "android.enableJetifier=true" \
            android/gradle.properties \
            || echo \
            "android.enableJetifier=true" \
            >> android/gradle.properties


      # ==========================================
      # 13 CHECK MAIN ACTIVITY
      # ==========================================

      - name: Verify Android V2 Embedding
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "ANDROID ACTIVITY"
          echo "======================================"

          find android/app/src/main \
            -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print

          echo ""
          echo "Checking old embedding..."

          if grep -Rqs \
            "io.flutter.app.FlutterActivity" \
            android/app/src/main \
            2>/dev/null; then

            echo "❌ OLD EMBEDDING STILL EXISTS"

            exit 1

          fi

          if grep -Rqs \
            "io.flutter.app.FlutterApplication" \
            android/app/src/main \
            2>/dev/null; then

            echo "❌ OLD APPLICATION STILL EXISTS"

            exit 1

          fi

          echo ""
          echo "✅ ANDROID V2 EMBEDDING OK"


      # ==========================================
      # 14 CLEAN
      # ==========================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean


      # ==========================================
      # 15 PUB GET
      # ==========================================

      - name: Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ==========================================
      # 16 FORMAT
      # ==========================================

      - name: Format
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dart format lib || true


      # ==========================================
      # 17 ANALYZE
      # ==========================================

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            || true


      # ==========================================
      # 18 BUILD APK
      # ==========================================

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "BUILDING SADEE X DIMA APK"
          echo "======================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons


      # ==========================================
      # 19 FIND APK
      # ==========================================

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          APK_FILE="$(
            find build \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then

            echo "❌ APK NOT FOUND"

            exit 1

          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER.apk"

          echo ""
          echo "======================================"
          echo "APK READY"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/final-apk/"


      # ==========================================
      # 20 UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: final-apk/SADEE-X-DIMA-OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 21 SUCCESS
      # ==========================================

      - name: Success
        run: |

          echo ""
          echo "=========================================="
          echo ""
          echo "   SADEE X DIMA OPTIMIZER"
          echo ""
          echo "       BUILD SUCCESS ✅"
          echo ""
          echo "=========================================="
