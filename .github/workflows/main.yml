name: SADEE X DIMA REAL BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-real-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: Put the project ZIP in the repository root.'
            ls -lah
            exit 1
          fi
          echo "ZIP FOUND: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e
          PROJECT=$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo 'ERROR: Android project not found inside ZIP.'
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi
          echo "ANDROID PROJECT: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Prepare Android Build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e
          touch gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

          if [ -f settings.gradle ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
          fi

          # Known Java compatibility fixes for older ZIPs.
          find app/src/main/java -type f -name '*.java' -print0 | xargs -0 sed -i 's/getCodeCache()/getCodeCacheDir()/g' || true
          if [ -f app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java ]; then
            grep -q '^import android.os.Bundle;' app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java || sed -i '/^package com\.sadee\.optimizer;/a import android.os.Bundle;' app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java
          fi
          mkdir -p app/src/main/res/color
          if [ -f app/src/main/res/values/nav_colors.xml ] && grep -q 'state_checked' app/src/main/res/values/nav_colors.xml; then
            mv app/src/main/res/values/nav_colors.xml app/src/main/res/color/nav_colors.xml
          fi

          echo 'BUILD PREPARED'
          java -version
          gradle --version | head -20

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" != '0' ]; then
            echo '========== COMPILER ERRORS =========='
            grep -n -A20 -B10 -E 'error:|cannot find symbol|symbol:|location:' build.log | tail -400 || true
            exit "$RESULT"
          fi
          echo 'APK BUILD SUCCESS'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-RELEASE
          path: ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e
          ADMIN=$(find extracted -type d -name 'admin-dashboard' | head -n 1)
          if [ -z "$ADMIN" ]; then
            INDEX=$(find extracted -type f -name 'index.html' | head -n 1)
            [ -n "$INDEX" ] || { echo 'ERROR: admin-dashboard/index.html not found.'; exit 1; }
            ADMIN=$(dirname "$INDEX")
          fi
          echo "ADMIN DASHBOARD: $ADMIN"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Admin Dashboard
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public
          cp -R "${{ steps.admin.outputs.admin }}/." public/
          touch public/.nojekyll
          echo 'ADMIN READY'

      - name: Deploy Admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
