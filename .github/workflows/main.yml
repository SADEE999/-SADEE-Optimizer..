name: SADEE X DIMA - REAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-release
  cancel-in-progress: true

jobs:

  build-release:
    name: Build APK + Admin → One ZIP
    runs-on: ubuntu-latest

    steps:

      # ================================
      # CHECKOUT
      # ================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================
      # FIND ZIP
      # ================================

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            echo ""
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ================================
      # EXTRACT
      # ================================

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "======================================"
          echo "EXTRACTED PROJECT"
          echo "======================================"

          find extracted \
            -maxdepth 8 \
            -type f \
            | sort


      # ================================
      # FIND ANDROID PROJECT
      # ================================

      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ================================
      # JAVA
      # ================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ================================
      # GRADLE
      # ================================

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      - name: Verify build tools
        run: |
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version


      # ================================
      # BUILD APK
      # ================================

      - name: Build Android APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "APK FILES:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ================================
      # FIND APK
      # ================================

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # ================================
      # FIND ADMIN
      # ================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: Admin dashboard not found."
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo "ADMIN DASHBOARD:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      # ================================
      # CREATE FINAL PACKAGE
      # ================================

      - name: Create final release package
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release/ADMIN_DASHBOARD

          # APK
          cp \
            "${{ steps.android.outputs.project }}/${{ steps.apk.outputs.apk }}" \
            release/SADEE_X_DIMA.apk

          # Admin dashboard
          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            release/ADMIN_DASHBOARD/

          # README
          cat > release/README.txt <<'EOF'
SADEE X DIMA REAL RELEASE

FILES
-----

SADEE_X_DIMA.apk
    Android application.

ADMIN_DASHBOARD/
    Web admin dashboard.

The admin dashboard connects to the configured Supabase project.

No email/password login is included in the dashboard.

IMPORTANT
---------
Do not expose a Supabase service-role/secret key in the APK
or frontend dashboard.
EOF

          echo "======================================"
          echo "FINAL PACKAGE"
          echo "======================================"

          find release \
            -maxdepth 5 \
            -type f \
            | sort


      # ================================
      # ZIP EVERYTHING
      # ================================

      - name: Create one final ZIP
        shell: bash
        run: |
          set -e

          cd release

          zip -r ../SADEE_X_DIMA_RELEASE.zip .

          cd ..

          echo ""
          echo "======================================"
          echo "FINAL RELEASE"
          echo "======================================"

          ls -lh SADEE_X_DIMA_RELEASE.zip

          echo ""
          echo "ZIP CONTENT:"
          unzip -l SADEE_X_DIMA_RELEASE.zip


      # ================================
      # UPLOAD ONE ARTIFACT
      # ================================

      - name: Upload final release
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-RELEASE
          path: SADEE_X_DIMA_RELEASE.zip
          if-no-files-found: error
          retention-days: 30


      # ================================
      # UPLOAD BUILD LOG
      # ================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore
