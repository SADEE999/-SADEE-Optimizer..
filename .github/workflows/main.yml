name: SADEE X DIMA - APK + ADMIN

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  # ==========================================
  # BUILD ANDROID APK
  # ==========================================

  build-apk:
    name: Extract ZIP & Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "================================"
          echo "EXTRACTED PROJECT"
          echo "================================"

          find extracted \
            -maxdepth 8 \
            -type f \
            | sort

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILDING APK"
          echo "================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: ${{ steps.android.outputs.project }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      # Optional: also attach APK to a GitHub Release
      - name: Upload APK Copy
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK-COPY
          path: ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # ==========================================
  # DEPLOY ADMIN DASHBOARD
  # ==========================================

  deploy-admin:
    name: Extract ZIP & Deploy Admin
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found."
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Website
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

      - name: Deploy Admin to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
