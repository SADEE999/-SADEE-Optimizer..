name: SADEE X DIMA REAL BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-real-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo '========================================='
          echo 'SEARCHING REPOSITORY FOR PROJECT ZIP'
          echo '========================================='
          ZIP="$(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*' ! -path './public/*' | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo 'ERROR: No project ZIP found.'
            echo 'Upload the generated SADEE_X_DIMA_FULL_FINAL.zip to the repository and commit it.'
            echo 'Repository files:'
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "ZIP FOUND: $ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1 || true)"
          if [ -z "$PROJECT" ]; then
            echo 'ERROR: No Android settings.gradle/settings.gradle.kts found inside the ZIP.'
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi
          echo "ANDROID PROJECT: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android build environment fixes
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.nonTransitiveRClass=' gradle.properties || echo 'android.nonTransitiveRClass=true' >> gradle.properties
          if [ -f settings.gradle ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle || true
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
            sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' settings.gradle.kts || true
          fi
          echo 'Build environment prepared.'

      - name: Build APK
        id: build
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo "Gradle exit code: $RESULT"
          if [ "$RESULT" != '0' ]; then
            echo '========================================='
            echo 'COMPILER ERRORS'
            echo '========================================='
            grep -n -A18 -B8 -E 'error:|cannot find symbol|symbol:|location:' build.log | tail -350 || true
            exit "$RESULT"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: ${{ steps.project.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: ${{ steps.project.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Find admin dashboard
        id: admin
        shell: bash
        run: |
          set -euo pipefail
          ADMIN="$(find extracted -type f -path '*/admin-dashboard/index.html' -printf '%h\n' | head -n 1 || true)"
          if [ -z "$ADMIN" ]; then
            INDEX="$(find extracted -type f -name index.html ! -path '*/node_modules/*' | head -n 1 || true)"
            if [ -z "$INDEX" ]; then
              echo 'ERROR: admin-dashboard/index.html not found inside ZIP.'
              find extracted -type f -name '*.html' | sort
              exit 1
            fi
            ADMIN="$(dirname "$INDEX")"
          fi
          echo "ADMIN: $ADMIN"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare admin Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -R "${{ steps.admin.outputs.admin }}/." public/
          touch public/.nojekyll
          echo 'Admin files:'
          find public -maxdepth 3 -type f | sort

      - name: Deploy admin dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
