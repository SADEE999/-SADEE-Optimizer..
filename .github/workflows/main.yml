name: SADEE X DIMA - Extract ZIP & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. FIND ZIP
      # =========================================================

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r -d '' FILE; do
            ZIP_FILE="$FILE"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo ""
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              ! -path "*/.git/*" \
              -print
            exit 1
          fi

          echo "================================"
          echo "ZIP FOUND"
          echo "================================"
          echo "$ZIP_FILE"

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 4. VALIDATE ZIP
      # =========================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip }}"

          echo "Testing ZIP..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP VALID."


      # =========================================================
      # 5. EXTRACT ZIP
      # =========================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip }}"
          EXTRACTED="$GITHUB_WORKSPACE/extracted"

          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"

          echo "================================"
          echo "EXTRACTING ZIP"
          echo "================================"

          unzip -q -o "$ZIP" -d "$EXTRACTED"

          FILE_COUNT="$(
            find "$EXTRACTED" \
              -type f \
              | wc -l
          )"

          echo ""
          echo "Extracted files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: ZIP extracted zero files."
            exit 1
          fi

          echo ""
          echo "EXTRACTION SUCCESS."


      # =========================================================
      # 6. SHOW EXTRACTED FILES
      # =========================================================

      - name: Show extracted project
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "EXTRACTED PROJECT"
          echo "================================"

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 6 \
            -print \
            | head -n 400


      # =========================================================
      # 7. DETECT ANDROID PROJECT
      # =========================================================

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/extracted"
          PROJECT=""

          echo "================================"
          echo "SEARCHING ANDROID PROJECT"
          echo "================================"

          # Search settings.gradle
          while IFS= read -r SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
          )

          # Fallback: search gradlew
          if [ -z "$PROJECT" ]; then

            while IFS= read -r GRADLEW; do

              DIR="$(dirname "$GRADLEW")"

              if [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; then

                PROJECT="$DIR"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -print
            )

          fi

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: Android project not found."
            echo ""
            find "$ROOT" -maxdepth 8 -print
            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 8. DETECT APP MODULE
      # =========================================================

      - name: Detect Android app module
        id: module
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          MODULE=""

          echo "================================"
          echo "SEARCHING APP MODULE"
          echo "================================"

          # Normal Android structure
          if [ -d "$PROJECT/app" ]; then

            if [ -f "$PROJECT/app/build.gradle" ] || \
               [ -f "$PROJECT/app/build.gradle.kts" ]; then

              MODULE="$PROJECT/app"

            fi

          fi

          # Fallback: search AndroidManifest
          if [ -z "$MODULE" ]; then

            while IFS= read -r MANIFEST; do

              DIR="$(dirname "$MANIFEST")"

              POSSIBLE_MODULE="$(realpath "$DIR/../.." 2>/dev/null || true)"

              if [ -f "$POSSIBLE_MODULE/build.gradle" ] || \
                 [ -f "$POSSIBLE_MODULE/build.gradle.kts" ]; then

                MODULE="$POSSIBLE_MODULE"
                break

              fi

            done < <(
              find "$PROJECT" \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -print
            )

          fi

          if [ -z "$MODULE" ]; then
            echo ""
            echo "ERROR: Android app module not found."
            echo ""
            find "$PROJECT" \
              -maxdepth 5 \
              -print
            exit 1
          fi

          MODULE="$(realpath "$MODULE")"

          echo ""
          echo "ANDROID APP MODULE:"
          echo "$MODULE"

          echo "module=$MODULE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 9. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                | head -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK READY."


      # =========================================================
      # 10. GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================================================
      # 11. GRADLE PROPERTIES
      # =========================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          touch gradle.properties

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
              >> gradle.properties
          fi

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=false" \
              >> gradle.properties
          fi

          echo ""
          echo "Gradle properties configured."


      # =========================================================
      # 12. GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper \
                --gradle-version 8.7

              chmod +x ./gradlew

            else

              echo "ERROR: Gradle is not installed."
              exit 1

            fi

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # =========================================================
      # 13. CLEAN
      # =========================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          echo "================================"
          echo "CLEAN BUILD"
          echo "================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 14. BUILD RELEASE APK
      # =========================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          echo "================================"
          echo "BUILDING RELEASE APK"
          echo "================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "================================"
          echo "RELEASE BUILD SUCCESS"
          echo "================================"


      # =========================================================
      # 15. LOCATE APK
      # =========================================================

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          MODULE="${{ steps.module.outputs.module }}"

          APK=""

          echo "================================"
          echo "SEARCHING FOR APK"
          echo "================================"

          echo ""
          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Module:"
          echo "$MODULE"

          # -----------------------------------------------------
          # METHOD 1
          # Normal release output
          # -----------------------------------------------------

          if [ -d "$MODULE/build/outputs/apk" ]; then

            APK="$(
              find "$MODULE/build/outputs/apk" \
                -type f \
                -name "*.apk" \
                -print \
                | grep "/release/" \
                | head -n 1 \
                || true
            )"

          fi

          # -----------------------------------------------------
          # METHOD 2
          # Search whole project
          # -----------------------------------------------------

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT" \
                -type f \
                -path "*/build/outputs/apk/release/*.apk" \
                -print \
                | head -n 1 \
                || true
            )"

          fi

          # -----------------------------------------------------
          # METHOD 3
          # Search extracted directory
          # -----------------------------------------------------

          if [ -z "$APK" ]; then

            APK="$(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name "*.apk" \
                -print \
                | grep "/release/" \
                | head -n 1 \
                || true
            )"

          fi

          # -----------------------------------------------------
          # FINAL CHECK
          # -----------------------------------------------------

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."
            echo ""

            echo "All APK files:"
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print \
              || true

            echo ""
            echo "Build outputs:"
            find "$PROJECT" \
              -path "*/build/outputs/*" \
              -print \
              || true

            exit 1

          fi

          # Remove accidental whitespace/newlines
          APK="$(printf '%s' "$APK" | head -n 1)"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK path does not exist:"
            echo "$APK"
            exit 1
          fi

          APK="$(realpath "$APK")"

          echo ""
          echo "================================"
          echo "APK FOUND"
          echo "================================"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 16. CREATE TEMPORARY SIGNING KEY
      # =========================================================

      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          SIGN_DIR="$RUNNER_TEMP/sadee-signing"

          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          keytool \
            -genkeypair \
            -v \
            -keystore "$SIGN_DIR/release.keystore" \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

          echo ""
          echo "TEMPORARY SIGNING KEY CREATED."


      # =========================================================
      # 17. ALIGN APK
      # =========================================================

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"

          TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist:"
            echo "$APK"
            exit 1
          fi

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            "$RUNNER_TEMP/aligned.apk"

          echo ""
          echo "APK ALIGN SUCCESS."


      # =========================================================
      # 18. SIGN APK
      # =========================================================

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/sadee-signing/release.keystore" \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out "$GITHUB_WORKSPACE/final-apk/SADEE_X_DIMA_OPTIMIZER.apk" \
            "$RUNNER_TEMP/aligned.apk"

          echo ""
          echo "APK SIGN SUCCESS."


      # =========================================================
      # 19. VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          APK="$GITHUB_WORKSPACE/final-apk/SADEE_X_DIMA_OPTIMIZER.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          "$TOOLS/apksigner" verify \
            --verbose \
            "$APK"

          echo ""
          echo "================================"
          echo "APK VERIFIED"
          echo "================================"

          ls -lh "$APK"


      # =========================================================
      # 20. UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ github.workspace }}/final-apk/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 21. SUCCESS
      # =========================================================

      - name: Build success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA OPTIMIZER BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP              : FOUND"
          echo "ZIP              : EXTRACTED"
          echo "ANDROID PROJECT  : DETECTED"
          echo "ANDROID MODULE   : DETECTED"
          echo "ANDROID SDK      : READY"
          echo "RELEASE APK      : BUILT"
          echo "APK              : ALIGNED"
          echo "APK              : SIGNED"
          echo "APK              : VERIFIED"
          echo ""
          echo "ADMIN PANEL      : NOT MODIFIED"
          echo "ADMIN PANEL      : NOT DEPLOYED"
          echo ""
          echo "APK ARTIFACT:"
          echo "SADEE_X_DIMA_OPTIMIZER.apk"
          echo ""
          echo "=============================================="
