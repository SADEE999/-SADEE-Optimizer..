name: SADEE X DIMA - Extract Build Sign APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. FIND ZIP UPLOADED TO GITHUB
      # --------------------------------------------------
      - name: Find uploaded ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for uploaded ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 4. EXTRACT ZIP
      # --------------------------------------------------
      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "======================================"
          echo "EXTRACTING ZIP"
          echo "======================================"

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "EXTRACTION COMPLETE"
          echo ""

          find extracted -maxdepth 5 -type f | head -200


      # --------------------------------------------------
      # 5. FIND ANDROID PROJECT
      # --------------------------------------------------
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -type f \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Extracted files:"
            find extracted -maxdepth 7 -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 6. ANDROID SDK
      # --------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$ANDROID_SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$ANDROID_SDK"


      # --------------------------------------------------
      # 7. INSTALL SDK PACKAGES
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -name sdkmanager \
            -type f \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 8. GRADLE
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # --------------------------------------------------
      # 9. PREPARE GRADLE
      # --------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

            chmod +x ./gradlew

            ./gradlew --version

          else

            echo "Gradle wrapper not found."
            echo "Using installed Gradle."

            gradle --version

          fi


      # --------------------------------------------------
      # 10. BUILD RELEASE APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING SADEE X DIMA APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew clean assembleRelease --stacktrace

          else

            gradle clean assembleRelease --stacktrace

          fi


      # --------------------------------------------------
      # 11. LOCATE APK
      # --------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Searching for release APK..."

          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK not found."

            echo ""
            echo "All APK files:"
            
            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          APK=$(realpath "$APK")

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 12. CREATE SIGNING KEY
      # --------------------------------------------------
      - name: Create temporary signing key
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/sadee-release.jks"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE, L=Colombo, ST=Western, C=LK"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 13. ZIPALIGN
      # --------------------------------------------------
      - name: Zipalign APK
        id: align
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          INPUT_APK="${{ steps.apk.outputs.apk }}"
          ALIGNED_APK="$RUNNER_TEMP/app-aligned.apk"

          if [ ! -f "$BUILD_TOOLS/zipalign" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          echo "aligned_apk=$ALIGNED_APK" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 14. SIGN APK
      # --------------------------------------------------
      - name: Sign APK
        id: sign
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          ALIGNED_APK="${{ steps.align.outputs.aligned_apk }}"
          SIGNED_APK="$RUNNER_TEMP/app-release.apk"

          if [ ! -f "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 15. VERIFY SIGNATURE
      # --------------------------------------------------
      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          APK="${{ steps.sign.outputs.signed_apk }}"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK"

          echo ""
          echo "======================================"
          echo "APK SIGNATURE VERIFIED"
          echo "======================================"


      # --------------------------------------------------
      # 16. SHOW APK INFO
      # --------------------------------------------------
      - name: Show APK information
        shell: bash
        run: |
          set -e

          APK="${{ steps.sign.outputs.signed_apk }}"

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"


      # --------------------------------------------------
      # 17. UPLOAD FINAL SIGNED APK
      # --------------------------------------------------
      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ steps.sign.outputs.signed_apk }}
          if-no-files-found: error
