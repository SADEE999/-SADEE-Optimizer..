name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==================================================
      # JAVA 17
      # No Gradle cache here
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # ANDROID SDK
      # IMPORTANT:
      # DO NOT USE android-actions/setup-android
      # This avoids the obsolete "tools" package error.
      # ==================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo "Android SDK configured."

      # ==================================================
      # FIND SDKMANAGER
      # ==================================================
      - name: Locate SDK Manager
        id: sdk
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      # ==================================================
      # INSTALL ONLY VALID SDK PACKAGES
      #
      # NEVER install:
      # sdkmanager tools
      # ==================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # ==================================================
      # FIND ZIP IN REPOSITORY
      # ==================================================
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            | sort \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ==================================================
      # EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction completed."

      # ==================================================
      # DETECT ANDROID PROJECT
      # ==================================================
      - name: Detect Android project
        id: android
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"
          PROJECT=""

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then
            GRADLEW=$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1)

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            BUILD=$(find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1)

            if [ -n "$BUILD" ]; then
              PROJECT="$(dirname "$BUILD")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find "$ROOT" -maxdepth 7 -type f | sort
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==================================================
      # INSPECT PROJECT
      # ==================================================
      - name: Inspect project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          echo "Project: $PROJECT"

          echo ""
          echo "Gradle files:"
          find "$PROJECT" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print

      # ==================================================
      # GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==================================================
      # PREPARE GRADLE
      #
      # IMPORTANT:
      # If ZIP already contains gradlew, use THAT wrapper.
      # Do not force Gradle 8.7 over the project.
      # ==================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper detected."

            chmod +x ./gradlew

          else

            echo "No Gradle wrapper found."

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ==================================================
      # GRADLE PROPERTIES
      # ==================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          touch gradle.properties

          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> gradle.properties
          fi

          if ! grep -q '^org.gradle.daemon=' gradle.properties; then
            echo 'org.gradle.daemon=false' >> gradle.properties
          fi

      # ==================================================
      # BUILD
      #
      # Do NOT run clean first.
      # This reduces unrelated Gradle failures.
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==================================================
      # FIND APK
      # ==================================================
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -Ei "release.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."

            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ==================================================
      # FIND BUILD TOOLS
      # ==================================================
      - name: Find build tools
        id: tools
        shell: bash
        run: |
          set -e

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -d "$TOOLS" ]; then
            TOOLS=$(find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1)
          fi

          if [ -z "$TOOLS" ]; then
            echo "ERROR: build-tools not found."
            exit 1
          fi

          echo "build_tools=$TOOLS" >> "$GITHUB_OUTPUT"

      # ==================================================
      # SIGNING KEY
      # ==================================================
      - name: Create temporary signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      # ==================================================
      # SIGN APK
      # ==================================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          TOOLS="${{ steps.tools.outputs.build_tools }}"

          mkdir -p signed

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            signed/aligned.apk

          "$TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/aligned.apk

          rm -f signed/aligned.apk

      # ==================================================
      # VERIFY
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          TOOLS="${{ steps.tools.outputs.build_tools }}"

          "$TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk

      # ==================================================
      # UPLOAD APK ONLY
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # ADMIN DASHBOARD
      # ==================================================
      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "No admin dashboard found."
            exit 0
          fi

          rm -rf public
          mkdir -p public

          ADMIN_DIR="$(dirname "$ADMIN")"

          cp -r "$ADMIN_DIR"/. public/

          echo "Admin dashboard prepared."

      # ==================================================
      # DEPLOY ADMIN
      # ==================================================
      - name: Deploy admin dashboard
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false

      # ==================================================
      # SUCCESS
      # ==================================================
      - name: Build success
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo " SADEE X DIMA BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP extracted"
          echo "Android project detected"
          echo "Release APK built"
          echo "APK signed"
          echo "APK verified"
          echo "APK uploaded"
          echo ""
          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk
