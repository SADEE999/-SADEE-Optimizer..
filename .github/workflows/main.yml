name: SADEE X DIMA Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

      - name: Find ZIP
        id: findzip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            | sort \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o \
            "${{ steps.findzip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"
          PROJECT=""

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then
            GRADLEW=$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1)

            if [ -n "$GRADLEW" ]; then
              PROJECT=$(dirname "$GRADLEW")
            fi
          fi

          if [ -z "$PROJECT" ]; then
            BUILD_FILE=$(find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project not found."
            find "$ROOT" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.7
              chmod +x ./gradlew
            else
              echo "Gradle wrapper not found."
              exit 1
            fi
          fi

          ./gradlew --version

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          touch gradle.properties

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=false" >> gradle.properties
          fi

      - name: Fix MainActivity
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          MAIN="$PROJECT/app/src/main/java/com/sadee/optimizer/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            MAIN=$(find "$PROJECT" \
              -type f \
              -name "MainActivity.java" \
              | head -n 1)
          fi

          if [ -z "$MAIN" ] || [ ! -f "$MAIN" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          CALLS=$(grep -c 'addStableGame("' "$MAIN" || true)
          METHOD=$(grep -cE 'void[[:space:]]+addStableGame[[:space:]]*\(' "$MAIN" || true)

          echo "addStableGame calls: $CALLS"
          echo "addStableGame methods: $METHOD"

          if [ "$CALLS" -gt 0 ] && [ "$METHOD" -eq 0 ]; then

            python3 - "$MAIN" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

method = """
    private void addStableGame(String gameName, String packageName) {
        try {
            PackageManager pm = getPackageManager();

            try {
                pm.getPackageInfo(packageName, 0);
            } catch (PackageManager.NameNotFoundException e) {
                return;
            }

            Intent launchIntent = pm.getLaunchIntentForPackage(packageName);

            if (launchIntent == null) {
                return;
            }

            launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

            Log.d(
                "SADEE_GAME",
                gameName + " detected: " + packageName
            );

        } catch (Exception e) {
            Log.e(
                "SADEE_GAME",
                "Game detection failed: " + gameName,
                e
            );
        }
    }

"""

pos = text.rfind("}")

if pos == -1:
    raise SystemExit("Final Java class brace not found")

text = text[:pos] + method + text[pos:]

imports = [
    "import android.content.Intent;",
    "import android.content.pm.PackageManager;",
    "import android.util.Log;"
]

lines = text.splitlines()

for imp in imports:
    if imp not in lines:
        package_index = -1

        for i, line in enumerate(lines):
            if line.startswith("package "):
                package_index = i
                break

        if package_index >= 0:
            lines.insert(package_index + 1, imp)

text = "\n".join(lines) + "\n"

with open(path, "w", encoding="utf-8") as f:
    f.write(text)

print("Missing addStableGame() fixed.")
PY

          fi

          echo "Java source check:"
          grep -n "addStableGame" "$MAIN" || true

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -Ei "release.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            find "$PROJECT" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Find build tools
        id: tools
        shell: bash
        run: |
          set -e

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -d "$TOOLS" ]; then
            TOOLS=$(find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1)
          fi

          if [ -z "$TOOLS" ]; then
            echo "Build tools not found."
            exit 1
          fi

          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"

      - name: Create signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          TOOLS="${{ steps.tools.outputs.tools }}"

          mkdir -p signed

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            signed/aligned.apk

          "$TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/aligned.apk

          rm -f signed/aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          TOOLS="${{ steps.tools.outputs.tools }}"

          "$TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "No admin dashboard found."
            exit 0
          fi

          rm -rf public
          mkdir -p public

          ADMIN_DIR=$(dirname "$ADMIN")

          cp -r "$ADMIN_DIR"/. public/

          echo "Admin dashboard prepared."

      - name: Deploy admin dashboard
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Success
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo " SADEE X DIMA BUILD SUCCESS"
          echo "========================================"
          echo "APK:"
          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk
