name: SADEE X DIMA RED NEON V5 - STABLE PAGES + SIGNED APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for candidate in \
            "SADEE_X_DIMA_RED_NEON_DASHBOARD_V5.zip" \
            "SADEE_X_DIMA_RED_NEON_DASHBOARD_V4.zip" \
            "SADEE_X_DIMA_AUTO_LOGIN_DASHBOARD_V3_PAGE_NAV_FIXED.zip" \
            "SADEE_X_DIMA_AUTO_LOGIN_DASHBOARD_V3_CRASH_FIXED.zip"; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | grep -Ei 'SADEE.*(RED|NEON|DASHBOARD|AUTO_LOGIN|FIXED)' | head -n 1 || true)"
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: No SADEE project ZIP found in repository root." >&2
            find . -maxdepth 2 -type f | sort
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted
          PROJECT="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found after extraction." >&2
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
          test -f app/src/main/java/com/sadee/optimizer/MainActivity.java
          test -f app/src/main/java/com/sadee/optimizer/DeviceInfo.java
          test -f app/src/main/java/com/sadee/optimizer/Supabase.java
          grep -q 'stableBoostPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableCleanPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableGamingPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableMorePage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'DEVICE NAME' app/src/main/java/com/sadee/optimizer/MainActivity.java

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          SDK="${ANDROID_HOME}"
          BUILD_TOOLS="$(ls -1 "$SDK/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$SDK/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p signed
          "$ZIPALIGN" -f 4 "$APK" signed/aligned.apk
          keytool -genkeypair -v -keystore signed/sadee-release.jks -storepass changeit -keypass changeit -alias sadee -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Colombo, ST=Western, C=LK' >/dev/null 2>&1
          "$APKSIGNER" sign --ks signed/sadee-release.jks --ks-pass pass:changeit --key-pass pass:changeit --out signed/SADEE-X-DIMA-RED-NEON-V5.apk signed/aligned.apk
          "$APKSIGNER" verify --verbose signed/SADEE-X-DIMA-RED-NEON-V5.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-RED-NEON-V5-SIGNED-APK
          path: signed/SADEE-X-DIMA-RED-NEON-V5.apk
          if-no-files-found: error

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V5-BUILD-LOGS
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
            signed/**
          if-no-files-found: warn

      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -euo pipefail
          ADMIN="$(find extracted -type f -path '*/admin-dashboard/index.html' | head -n 1 | xargs -r dirname)"
          if [ -z "$ADMIN" ]; then
            echo "No admin dashboard found; skipping deploy."
            exit 0
          fi
          rm -rf public
          mkdir -p public
          cp -R "$ADMIN"/* public/
          touch public/.nojekyll

      - name: Deploy admin dashboard
        if: ${{ success() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
