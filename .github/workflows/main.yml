name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP + Build APK + Deploy Admin
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT EVERYTHING
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true


      # =====================================================
      # 2. SHOW REPOSITORY FILES
      # =====================================================

      - name: Show Repository Files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY CONTENT"
          echo "=========================================="

          find . \
            -type f \
            ! -path "./.git/*" \
            | sort \
            | head -500


      # =====================================================
      # 3. FIND ZIP
      # =====================================================

      - name: Find Flutter ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR ZIP"
          echo "=========================================="

          ZIP_FILE=""

          # Search all ZIP files in repository
          while IFS= read -r file; do

            if [ -n "$file" ]; then
              ZIP_FILE="$file"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -iname "*.zip" \
                -o \
                -iname "*.ZIP" \
              \) \
              ! -path "*/.git/*" \
              ! -path "*/extracted/*" \
              ! -path "*/build/*" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: ZIP NOT FOUND"
            echo "=========================================="

            echo ""
            echo "GitHub checkout contains:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              ! -path "*/.git/*" \
              | sort

            echo ""
            echo "Upload your Flutter ZIP to the ROOT of the repository."
            echo ""
            echo "Example:"
            echo "SADEE_X_DIMA_FIXED_FINAL.zip"
            echo ""

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # =====================================================
      # 4. EXTRACT ZIP
      # =====================================================

      - name: Extract Flutter ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_file }}"

          rm -rf extracted

          mkdir -p extracted

          echo "=========================================="
          echo "EXTRACTING ZIP"
          echo "=========================================="

          echo "ZIP:"
          echo "$ZIP"

          unzip -o "$ZIP" -d extracted

          echo ""
          echo "=========================================="
          echo "EXTRACTED FILES"
          echo "=========================================="

          find extracted \
            -maxdepth 8 \
            -type f \
            | sort \
            | head -1000


      # =====================================================
      # 5. FIND FLUTTER PROJECT
      # =====================================================

      - name: Detect Flutter Project
        id: flutter
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR PUBSPEC.YAML"
          echo "=========================================="

          PUBSPEC=""

          while IFS= read -r file; do

            if [ -n "$file" ]; then

              DIR="$(dirname "$file")"

              if [ -d "$DIR/android" ] && [ -d "$DIR/lib" ]; then
                PUBSPEC="$file"
                break
              fi

            fi

          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              -print
          )

          if [ -z "$PUBSPEC" ]; then

            echo "::error::Flutter project not found inside ZIP."

            echo ""
            echo "pubspec files:"
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              -print

            echo ""
            echo "ZIP structure:"
            find extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -1000

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "=========================================="
          echo "FLUTTER PROJECT FOUND"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =====================================================
      # 6. SHOW FLUTTER PROJECT
      # =====================================================

      - name: Verify Flutter Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo ""
          echo "PUBSPEC:"
          cat pubspec.yaml

          echo ""
          echo "LIB:"
          find lib \
            -maxdepth 4 \
            -type f \
            | sort

          echo ""
          echo "ANDROID:"
          find android \
            -maxdepth 5 \
            -type f \
            | sort | head -300


      # =====================================================
      # 7. SETUP FLUTTER
      # =====================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true


      # =====================================================
      # 8. INSTALL V6 USER HOME
      # =====================================================

      - name: Install V6 User Home
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING V6 UI"
          echo "=========================================="

          V6=""

          # Search repository V6 file
          V6="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
              ! -path "*/.git/*" \
              ! -path "*/extracted/*" \
              -print \
              | head -n 1
          )"

          if [ -z "$V6" ]; then

            echo "V6 file not found."
            echo "Keeping User Home from ZIP."

            exit 0
          fi

          echo "V6 FILE:"
          echo "$V6"

          mkdir -p "$PROJECT_DIR/lib/screens"

          if [ -f "$PROJECT_DIR/lib/screens/user_home.dart" ]; then

            cp "$V6" \
              "$PROJECT_DIR/lib/screens/user_home.dart"

            echo "Installed:"
            echo "lib/screens/user_home.dart"

          elif [ -f "$PROJECT_DIR/lib/screens/user_home_fixed.dart" ]; then

            cp "$V6" \
              "$PROJECT_DIR/lib/screens/user_home_fixed.dart"

            echo "Installed:"
            echo "lib/screens/user_home_fixed.dart"

          else

            cp "$V6" \
              "$PROJECT_DIR/lib/screens/user_home.dart"

            echo "Created:"
            echo "lib/screens/user_home.dart"

          fi


      # =====================================================
      # 9. FLUTTER CLEAN
      # =====================================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          flutter clean


      # =====================================================
      # 10. PUB GET
      # =====================================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          flutter pub get


      # =====================================================
      # 11. DART FORMAT
      # =====================================================

      - name: Format Dart
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          dart format lib


      # =====================================================
      # 12. ANALYZE
      # =====================================================

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          STATUS=$?

          # Analyze warnings/errors should be visible,
          # but don't stop APK build here.
          exit 0


      # =====================================================
      # 13. ANDROIDX
      # =====================================================

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          touch android/gradle.properties

          grep -q "^android.useAndroidX=true" \
            android/gradle.properties \
            || echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=true" \
            android/gradle.properties \
            || echo "android.enableJetifier=true" >> android/gradle.properties

          grep -q "^org.gradle.jvmargs=" \
            android/gradle.properties \
            || echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> android/gradle.properties


      # =====================================================
      # 14. BUILD USER APK
      # =====================================================

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING USER APK"
          echo "=========================================="

          if grep -q "flavorDimensions" android/app/build.gradle 2>/dev/null \
             || grep -q "productFlavors" android/app/build.gradle 2>/dev/null; then

            flutter build apk \
              --release \
              --flavor user \
              -t lib/main_user.dart

          else

            echo "No Flutter flavors detected."

            flutter build apk \
              --release \
              -t lib/main_user.dart

          fi


      # =====================================================
      # 15. FIND USER APK
      # =====================================================

      - name: Find User APK
        id: user_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "::error::User APK not found."

            find build/app/outputs \
              -type f \
              | sort

            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/SADEE-X-DIMA-OPTIMIZER.apk

          echo "APK:"
          ls -lh release/SADEE-X-DIMA-OPTIMIZER.apk


      # =====================================================
      # 16. UPLOAD APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-X-DIMA-OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30


      # =====================================================
      # 17. FIND ADMIN DASHBOARD
      # =====================================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=""

          if [ -d "$PROJECT_DIR/admin-dashboard" ] \
             && [ -f "$PROJECT_DIR/admin-dashboard/index.html" ]; then

            ADMIN="$PROJECT_DIR/admin-dashboard"

          fi

          if [ -z "$ADMIN" ]; then

            INDEX="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "index.html" \
                ! -path "*/build/*" \
                ! -path "*/.dart_tool/*" \
                ! -path "*/node_modules/*" \
                -print \
                | head -n 1
            )"

            if [ -n "$INDEX" ]; then
              ADMIN="$(dirname "$INDEX")"
            fi

          fi

          if [ -z "$ADMIN" ]; then

            echo "No admin dashboard found."

            echo "found=false" >> "$GITHUB_OUTPUT"

          else

            echo "Admin dashboard:"
            echo "$ADMIN"

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$ADMIN" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # 18. PREPARE ADMIN
      # =====================================================

      - name: Prepare Admin Dashboard
        if: steps.admin.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.path }}/." \
            public/

          touch public/.nojekyll

          echo "=========================================="
          echo "ADMIN FILES"
          echo "=========================================="

          find public \
            -maxdepth 5 \
            -type f \
            | sort


      # =====================================================
      # 19. DEPLOY ADMIN TO GITHUB PAGES
      # =====================================================

      - name: Deploy Admin Dashboard
        if: steps.admin.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy SADEE X DIMA Admin"


      # =====================================================
      # 20. BUILD SUMMARY
      # =====================================================

      - name: Success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "     SADEE X DIMA BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "ZIP extracted successfully."
          echo "Flutter project detected."
          echo "V6 UI installed if available."
          echo "APK build completed."
          echo ""
          echo "Download APK from:"
          echo "Actions -> Workflow Run -> Artifacts"
          echo ""
          echo "=========================================="
