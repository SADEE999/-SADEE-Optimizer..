name: SADEE X DIMA - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # JAVA
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # ==============================
      # FIND ZIP
      # ==============================
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ==============================
      # EXTRACT
      # ==============================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

      # ==============================
      # FIND ANDROID PROJECT
      # ==============================
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            find extracted \
              -maxdepth 5 \
              -type f \
              | head -100

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==============================
      # GRADLE
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

          ./gradlew --version

      # ==============================
      # GRADLE PROPERTIES
      # ==============================
      - name: Configure Gradle
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # ==============================
      # CLEAN
      # ==============================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==============================
      # BUILD
      # ==============================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ==============================
      # FIND APK
      # ==============================
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -i release \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ==============================
      # BUILD TOOLS
      # ==============================
      - name: Find Build Tools
        id: tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Build tools not found."
            exit 1
          fi

          echo "Build tools:"
          echo "$BUILD_TOOLS"

          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      # ==============================
      # SIGNING KEY
      # ==============================
      - name: Create signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      # ==============================
      # SIGN APK
      # ==============================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          BUILD_TOOLS="${{ steps.tools.outputs.build_tools }}"

          mkdir -p signed

          cp "$APK" signed/SADEE_X_DIMA_OPTIMIZER.apk

          "$BUILD_TOOLS/zipalign" \
            -f \
            -v \
            4 \
            signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/aligned.apk

          mv \
            signed/aligned.apk \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

      # ==============================
      # VERIFY
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="${{ steps.tools.outputs.build_tools }}"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          echo "APK verification successful."

      # ==============================
      # APK INFO
      # ==============================
      - name: APK information
        shell: bash
        run: |
          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk
          sha256sum signed/SADEE_X_DIMA_OPTIMIZER.apk

      # ==============================
      # UPLOAD ONLY APK
      # IMPORTANT:
      # No **/build/** glob here.
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # ADMIN DASHBOARD
      # ==============================
      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "Admin dashboard not found."
            exit 0
          fi

          echo "Admin dashboard:"
          echo "$ADMIN"

          rm -rf public
          mkdir -p public

          ADMIN_DIR=$(dirname "$ADMIN")

          cp -r "$ADMIN_DIR"/* public/

      # ==============================
      # DEPLOY ADMIN
      # ==============================
      - name: Deploy admin dashboard
        if: success() && hashFiles('public/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false

      # ==============================
      # FINAL
      # ==============================
      - name: Build completed
        if: success()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo " SADEE X DIMA BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "APK:"
          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk
          echo ""
          echo "Build completed successfully."
