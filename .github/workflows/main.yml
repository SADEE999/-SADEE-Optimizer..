name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-real-build
  cancel-in-progress: true

jobs:

  build-apk-and-admin:

    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # FIND ZIP
      # ======================================================

      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING PROJECT ZIP"
          echo "========================================"

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # EXTRACT ZIP
      # ======================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING ZIP"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted

          echo "ZIP EXTRACTION COMPLETE"


      # ======================================================
      # FIND ANDROID PROJECT
      # ======================================================

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING ANDROID PROJECT"
          echo "========================================"

          PROJECT=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."

            find extracted \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ======================================================
      # JAVA 17
      # ======================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # GRADLE 8.0
      # ======================================================

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      # ======================================================
      # ENABLE ANDROIDX
      # ======================================================

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          sed -i \
            '/^android.useAndroidX=/d' \
            gradle.properties || true

          sed -i \
            '/^android.enableJetifier=/d' \
            gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "AndroidX enabled."


      # ======================================================
      # FIX GRADLE REPOSITORY MODE
      # ======================================================

      - name: Fix Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          if [ -f settings.gradle.kts ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

          fi


      # ======================================================
      # FIX COLOR SELECTOR
      # ======================================================

      - name: Fix Color Selector Resources
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/color

          if [ -f app/src/main/res/values/nav_colors.xml ]; then

            if grep -q "state_checked" \
              app/src/main/res/values/nav_colors.xml; then

              echo "Moving nav_colors.xml to res/color..."

              mv \
                app/src/main/res/values/nav_colors.xml \
                app/src/main/res/color/nav_colors.xml

            fi

          fi


      # ======================================================
      # FIX PAGE5 BUNDLE IMPORT
      # ======================================================

      - name: Fix Page5InjectorFragment Bundle Import
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java"

          echo "========================================"
          echo "CHECKING PAGE5 INJECTOR"
          echo "========================================"

          if [ ! -f "$FILE" ]; then
            echo "Page5InjectorFragment.java not found."
            exit 1
          fi

          echo ""
          echo "BEFORE:"
          sed -n '1,25p' "$FILE"

          # Add Bundle import if missing
          if ! grep -q "^import android.os.Bundle;" "$FILE"; then

            echo ""
            echo "Adding missing Bundle import..."

            sed -i \
              '/^package com\.sadee\.optimizer;/a import android.os.Bundle;' \
              "$FILE"

          fi

          echo ""
          echo "AFTER:"
          sed -n '1,25p' "$FILE"


      # ======================================================
      # CHECK IMPORTANT JAVA IMPORTS
      # ======================================================

      - name: Check Page5 Java File
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java"

          echo "========================================"
          echo "PAGE5 SOURCE"
          echo "========================================"

          nl -ba "$FILE" | sed -n '1,80p'


      # ======================================================
      # PROJECT CHECK
      # ======================================================

      - name: Check Android Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          echo ""
          echo "JAVA SOURCES:"

          find app/src/main/java \
            -type f \
            -name "*.java" \
            | sort


      # ======================================================
      # CLEAN
      # ======================================================

      - name: Clean Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "BUILDING SADEE X DIMA APK"
          echo "========================================"

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          echo "EXIT CODE: $RESULT"

          if [ "$RESULT" != "0" ]; then

            echo ""
            echo "========================================"
            echo "JAVA COMPILER ERRORS"
            echo "========================================"

            grep -n \
              -A20 \
              -B10 \
              "cannot find symbol" \
              build.log \
              | tail -300 || true

            echo ""
            echo "========================================"
            echo "SYMBOL / LOCATION"
            echo "========================================"

            grep -n \
              -A10 \
              -B5 \
              -E \
              "symbol:|location:" \
              build.log \
              | tail -200 || true

            echo ""
            echo "========================================"
            echo "ALL ERRORS"
            echo "========================================"

            grep -n \
              -E \
              "error:|cannot find symbol|symbol:|location:" \
              build.log \
              | tail -300 || true

            exit "$RESULT"

          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"


      # ======================================================
      # LOCATE APK
      # ======================================================

      - name: Locate APK
        if: success()
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-RELEASE
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ======================================================
      # UPLOAD BUILD LOG
      # ======================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore


      # ======================================================
      # FIND ADMIN
      # ======================================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING ADMIN DASHBOARD"
          echo "========================================"

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then

              echo "ERROR: Admin dashboard not found."

              echo ""
              echo "HTML FILES:"

              find extracted \
                -type f \
                -name "*.html" \
                | sort

              exit 1

            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo ""
          echo "ADMIN DASHBOARD:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # PREPARE ADMIN
      # ======================================================

      - name: Prepare Admin Dashboard
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING ADMIN DASHBOARD"
          echo "========================================"

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo ""
          echo "ADMIN FILES:"

          find public \
            -maxdepth 10 \
            -type f \
            | sort


      # ======================================================
      # DEPLOY ADMIN
      # ======================================================

      - name: Deploy Admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
