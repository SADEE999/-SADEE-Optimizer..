name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================
      # CHECKOUT GITHUB REPOSITORY
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================
      # JAVA
      # IMPORTANT:
      # NO GRADLE CACHE HERE
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: "none"

      # ============================================
      # ANDROID SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # INSTALL SDK PACKAGES
      # ============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"

      # ============================================
      # FIND ZIP UPLOADED TO GITHUB
      # ============================================
      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "Searching GitHub repository for ZIP..."

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip|*.ZIP)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" \) \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              ! -path "$GITHUB_WORKSPACE/extracted/*" \
              ! -path "$GITHUB_WORKSPACE/build/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "=========================================="
            echo "ERROR: NO ZIP FILE FOUND"
            echo "=========================================="
            echo ""
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================
      # EXTRACT ZIP
      # ============================================
      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Extracting:"
          echo "${{ steps.zip.outputs.zip_file }}"

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "ZIP EXTRACTION COMPLETE"
          echo ""

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            | head -200

      # ============================================
      # FIND ANDROID PROJECT INSIDE EXTRACTED ZIP
      # ============================================
      - name: Detect Android project
        id: android
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          PROJECT=""

          # First search settings.gradle
          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          # Fallback: search build.gradle
          if [ -z "$PROJECT" ]; then

            BUILD_FILE=$(find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT="$(dirname "$BUILD_FILE")"
            fi
          fi

          # Fallback: search gradlew
          if [ -z "$PROJECT" ]; then

            GRADLEW=$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1)

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "=========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=========================================="
            echo ""
            echo "Extracted files:"
            find "$ROOT" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT"
          echo "=========================================="

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ============================================
      # SHOW PROJECT
      # ============================================
      - name: Inspect Android project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          echo "Project directory:"
          echo "$PROJECT"

          echo ""
          echo "Project files:"
          find "$PROJECT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      # ============================================
      # SETUP GRADLE
      # ============================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      # ============================================
      # PREPARE GRADLE WRAPPER
      # ============================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "No Gradle wrapper found."

            echo "Creating Gradle 8.7 wrapper..."

            gradle wrapper \
              --gradle-version 8.7

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================
      # CONFIGURE GRADLE
      # ============================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          if [ ! -f "gradle.properties" ]; then
            touch gradle.properties
          fi

          if ! grep -q "org.gradle.jvmargs" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> gradle.properties
          fi

          if ! grep -q "org.gradle.daemon" gradle.properties; then
            echo "org.gradle.daemon=false" >> gradle.properties
          fi

          echo "Gradle configured."

      # ============================================
      # CLEAN
      # ============================================
      - name: Gradle clean
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================
      # BUILD RELEASE
      # ============================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          echo "Starting Android release build..."

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo "RELEASE BUILD FINISHED"

      # ============================================
      # FIND APK
      # ============================================
      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -Ei "release.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | head -n 1)

          fi

          if [ -z "$APK" ]; then
            echo "=========================================="
            echo "ERROR: APK NOT FOUND"
            echo "=========================================="

            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ============================================
      # FIND BUILD TOOLS
      # ============================================
      - name: Find Android build tools
        id: tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          echo "BUILD TOOLS:"
          echo "$BUILD_TOOLS"

          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      # ============================================
      # CREATE TEMP SIGNING KEY
      # ============================================
      - name: Create signing key
        shell: bash
        run: |
          set -e

          rm -rf signing

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      # ============================================
      # ALIGN + SIGN APK
      # ============================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          BUILD_TOOLS="${{ steps.tools.outputs.build_tools }}"

          rm -rf signed
          mkdir -p signed

          cp "$APK" \
            signed/SADEE_X_DIMA_OPTIMIZER_UNSIGNED.apk

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            signed/SADEE_X_DIMA_OPTIMIZER_UNSIGNED.apk \
            signed/SADEE_X_DIMA_OPTIMIZER_ALIGNED.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/SADEE_X_DIMA_OPTIMIZER_ALIGNED.apk

          rm -f \
            signed/SADEE_X_DIMA_OPTIMIZER_UNSIGNED.apk \
            signed/SADEE_X_DIMA_OPTIMIZER_ALIGNED.apk

          echo "APK SIGNED SUCCESSFULLY"

      # ============================================
      # VERIFY APK
      # ============================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="${{ steps.tools.outputs.build_tools }}"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          echo ""
          echo "APK SIGNATURE VERIFIED"

      # ============================================
      # UPLOAD APK ONLY
      # NO RECURSIVE BUILD GLOB
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ github.workspace }}/signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================
      # PREPARE ADMIN DASHBOARD
      # ============================================
      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "No admin dashboard found."
            exit 0
          fi

          rm -rf public
          mkdir -p public

          ADMIN_DIR="$(dirname "$ADMIN")"

          cp -r "$ADMIN_DIR"/. public/

          echo "ADMIN DASHBOARD READY"

      # ============================================
      # DEPLOY ADMIN DASHBOARD
      # ============================================
      - name: Deploy admin dashboard
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false

      # ============================================
      # SUCCESS
      # ============================================
      - name: Final success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "      SADEE X DIMA BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP extracted successfully."
          echo "Android project detected successfully."
          echo "APK built successfully."
          echo "APK signed successfully."
          echo "APK verified successfully."
          echo ""
          ls -lh "$GITHUB_WORKSPACE/signed/SADEE_X_DIMA_OPTIMIZER.apk"
          echo ""
          echo "=============================================="
