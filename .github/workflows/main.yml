name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP Anywhere In Repository
        id: zip
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=""

          # First search root
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1 || true)

          # If not found, search subfolders
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f -iname "*.zip" \
              ! -path "./.git/*" \
              ! -path "./extracted/*" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING PROJECT ZIP"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "EXTRACTED FILES:"
          find extracted -maxdepth 5 -type f | sort | head -500

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING ANDROID PROJECT"
          echo "======================================"

          PROJECT=$(find extracted \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."

            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "gradlew" \) \
              | sort

            exit 1
          fi

          echo "PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Prepare Android Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING ANDROID PROJECT"
          echo "======================================"

          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties || true
          sed -i '/^android.enableJetifier=/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Repository mode compatibility
          if [ -f settings.gradle ]; then
            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true
          fi

          if [ -f settings.gradle.kts ]; then
            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true
          fi

      - name: Fix Known Android Source Errors
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FIXING KNOWN SOURCE ERRORS"
          echo "======================================"

          # Page5 Bundle import
          FILE="app/src/main/java/com/sadee/optimizer/Page5InjectorFragment.java"

          if [ -f "$FILE" ]; then
            if ! grep -q "^import android.os.Bundle;" "$FILE"; then
              sed -i \
                '/^package com\.sadee\.optimizer;/a import android.os.Bundle;' \
                "$FILE"
            fi
          fi

          # Move selector resource if incorrectly placed
          mkdir -p app/src/main/res/color

          if [ -f app/src/main/res/values/nav_colors.xml ]; then
            if grep -q "state_checked" \
              app/src/main/res/values/nav_colors.xml; then
              mv \
                app/src/main/res/values/nav_colors.xml \
                app/src/main/res/color/nav_colors.xml
            fi
          fi

          # Old invalid attribute
          find app/src/main/res \
            -type f \
            -name "*.xml" \
            -print0 |
          xargs -0 sed -i \
            's/android:hintTextColor=/android:textColorHint=/g' \
            2>/dev/null || true

      - name: Fix Java 17 Compatibility
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING JAVA COMPATIBILITY"
          echo "======================================"

          # Remove obsolete javax.xml.bind DatatypeConverter usage
          # when present in Supabase.java.
          FILE="app/src/main/java/com/sadee/optimizer/Supabase.java"

          if [ -f "$FILE" ]; then
            if grep -q "javax.xml.bind.DatatypeConverter" "$FILE"; then

              echo "Replacing javax.xml.bind date parser..."

              python3 - <<'PY'
from pathlib import Path

p = Path("app/src/main/java/com/sadee/optimizer/Supabase.java")
s = p.read_text()

old = """try { return javax.xml.bind.DatatypeConverter.parseDateTime(s).getTimeInMillis(); } catch (Exception e) {}"""

new = """try {
    String v = s;
    if (v.endsWith("Z")) v = v.substring(0, v.length() - 1) + "+00:00";
    return java.time.OffsetDateTime.parse(v).toInstant().toEpochMilli();
} catch (Exception e) {}"""

if old in s:
    s = s.replace(old, new)
    p.write_text(s)
PY

            fi
          fi

          # MainActivity getCodeCache compatibility
          MAIN="app/src/main/java/com/sadee/optimizer/MainActivity.java"

          if [ -f "$MAIN" ]; then

            if grep -q "getCodeCache()" "$MAIN"; then

              echo "Replacing getCodeCache() with cache directory..."

              sed -i \
                's/getCodeCache()/getCacheDir()/g' \
                "$MAIN"

            fi
          fi

      - name: Check Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          echo ""
          echo "JAVA FILES:"
          find app/src/main/java \
            -type f \
            -name "*.java" \
            | sort

      - name: Clean
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Build APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "BUILD EXIT CODE: $RESULT"

          if [ "$RESULT" != "0" ]; then

            echo ""
            echo "======================================"
            echo "COMPILER ERRORS"
            echo "======================================"

            grep -n \
              -A20 \
              -B10 \
              "error:" \
              build.log \
              | tail -400 || true

            exit "$RESULT"
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESS"
          echo "======================================"

      - name: Locate APK
        if: success()
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING ADMIN DASHBOARD"
          echo "======================================"

          ADMIN=""

          ADMIN=$(find extracted \
            -type d \
            -iname "admin-dashboard" \
            | head -n 1 || true)

          if [ -z "$ADMIN" ]; then
            INDEX=$(find extracted \
              -type f \
              -iname "index.html" \
              | head -n 1 || true)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html / admin-dashboard not found."

              find extracted \
                -type f \
                \( -name "*.html" -o -name "*.htm" \) \
                | sort

              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Admin
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo "ADMIN FILES:"
          find public -type f | sort

      - name: Deploy Admin
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
