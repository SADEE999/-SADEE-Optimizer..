name: Admin Panel - GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Admin Panel
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " PREPARING ADMIN PANEL"
          echo "======================================"

          if [ ! -f "admin-dashboard/index.html" ]; then
            echo "ERROR: admin-dashboard/index.html not found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          # Copy ADMIN PANEL ONLY.
          # Original admin-dashboard files are NOT modified.
          cp -a admin-dashboard/. _site/

          # GitHub Pages should serve index.html from the site root.
          test -f "_site/index.html"

          # Prevent Jekyll from changing the static site.
          touch _site/.nojekyll

          echo ""
          echo "Published files:"
          find _site -maxdepth 3 -type f -print

          echo ""
          echo "ROOT INDEX:"
          ls -lh _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
