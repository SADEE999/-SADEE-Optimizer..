name: SADEE X DIMA - Extract ZIP & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repo එක download
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. ZIP එක automatically හොයනවා
      - name: Find uploaded ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 4. ZIP එක extract කරනවා
      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "================================="
          echo "EXTRACTING ZIP"
          echo "================================="

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "EXTRACTION COMPLETE"
          echo ""

          find extracted -maxdepth 5 -type f | head -200

      # 5. Extract කරපු folder එක ඇතුළේ Android project එක හොයනවා
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -type f \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found after extraction!"
            echo ""
            echo "Extracted structure:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "================================="
          echo "ANDROID PROJECT FOUND"
          echo "================================="
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. Build
      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "================================="
          echo "BUILDING SADEE X DIMA APK"
          echo "================================="

          ./gradlew clean assembleRelease --stacktrace

      # 9. APK හොයනවා
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"

            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk"

            exit 1
          fi

          APK=$(realpath "$APK")

          echo "================================="
          echo "APK FOUND"
          echo "$APK"
          echo "================================="

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 10. APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
