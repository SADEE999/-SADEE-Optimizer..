name: SADEE X DIMA V3 - AUTO LOGIN + DASHBOARD + SIGNED APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "ZIP files found:"
          find . -type f -iname '*.zip' ! -path './.git/*' -print | sort

          ZIP="$(find . -type f -iname 'SADEE_X_DIMA_AUTO_LOGIN_DASHBOARD_V3.zip' ! -path './.git/*' | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname '*.zip' ! -path './.git/*' | grep -Ei 'AUTO_LOGIN|DASHBOARD|FULL_FIXED|ADVANCED.*V2|GREEN' | sort | tail -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname '*.zip' ! -path './.git/*' | sort | tail -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::No project ZIP found. Upload the V3 ZIP to the repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT" ]; then
            echo "::error::No Android Gradle project found inside ZIP."
            find extracted -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Verify V3 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/Supabase.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/DeviceInfo.java"
          grep -q 'tryAutoLogin' "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/MainActivity.java"
          grep -q 'sadee_secure_session' "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/MainActivity.java"
          echo "V3 auto-login source check: OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace --info

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced."
            exit 1
          fi
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          echo "Built: $APK"

      - name: Prepare signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          "$BT/zipalign" -f -v 4 "$APK_PATH" aligned.apk

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore sadee-release.keystore \
            -alias sadee-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname 'CN=SADEE X DIMA, OU=Mobile, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK'

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" sign \
            --ks sadee-release.keystore \
            --ks-key-alias sadee-release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out SADEE-X-DIMA-AUTO-LOGIN-release.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose SADEE-X-DIMA-AUTO-LOGIN-release.apk
          ls -lh SADEE-X-DIMA-AUTO-LOGIN-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-AUTO-LOGIN-SIGNED-APK
          path: SADEE-X-DIMA-AUTO-LOGIN-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V3-BUILD-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare admin dashboard
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DIR="$(find "$PROJECT_DIR" -type f -path '*/admin-dashboard/index.html' -print -quit | xargs -r dirname)"
          if [ -z "$ADMIN_DIR" ]; then
            echo "No admin dashboard found; skipping Pages deployment."
            exit 0
          fi
          rm -rf public
          mkdir -p public
          cp -R "$ADMIN_DIR"/. public/
          touch public/.nojekyll
          echo "Admin dashboard prepared from $ADMIN_DIR"

      - name: Deploy admin dashboard
        if: success() && hashFiles('public/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
