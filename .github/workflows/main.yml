name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"


      - name: Find SDK Manager
        id: sdk
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"


      # =========================================================
      # FIND ZIP
      # =========================================================

      - name: Find ZIP project
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            | sort \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # EXTRACT ZIP
      # =========================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted

          echo "Extraction completed."


      # =========================================================
      # DETECT ANDROID PROJECT
      # =========================================================

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          PROJECT=""

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then

            GRADLEW=$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1)

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi

          fi

          if [ -z "$PROJECT" ]; then

            BUILD_FILE=$(find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT="$(dirname "$BUILD_FILE")"
            fi

          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."

            find "$ROOT" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # =========================================================
      # PROJECT INFO
      # =========================================================

      - name: Inspect project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          echo "PROJECT:"
          echo "$PROJECT"

          echo ""
          echo "GRADLE FILES:"

          find "$PROJECT" \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print


      # =========================================================
      # SETUP GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================================================
      # PREPARE GRADLE
      # =========================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "No Gradle wrapper found."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper --gradle-version 8.7

            else

              echo "ERROR: Gradle wrapper missing."
              exit 1

            fi

            chmod +x ./gradlew

          fi

          ./gradlew --version


      # =========================================================
      # CONFIGURE GRADLE
      # =========================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          touch gradle.properties

          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> gradle.properties
          fi

          if ! grep -q '^org.gradle.daemon=' gradle.properties; then
            echo 'org.gradle.daemon=false' >> gradle.properties
          fi


      # =========================================================
      # AUTO FIX MISSING addStableGame()
      # =========================================================

      - name: Auto fix missing addStableGame method
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          MAIN="$PROJECT/app/src/main/java/com/sadee/optimizer/MainActivity.java"

          if [ ! -f "$MAIN" ]; then

            echo "MainActivity.java not found at expected path."

            MAIN=$(find "$PROJECT" \
              -type f \
              -name "MainActivity.java" \
              | head -n 1)

          fi

          if [ -z "$MAIN" ] || [ ! -f "$MAIN" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"


          # -----------------------------------------------------
          # Check whether method already exists
          # -----------------------------------------------------

          if grep -qE 'addStableGame[[:space:]]*\(' "$MAIN"; then

            echo "addStableGame() reference/method detected."

          else

            echo "No addStableGame() detected."
            echo "Nothing to patch."

          fi


          # -----------------------------------------------------
          # If calls exist but method definition does not exist,
          # inject a safe implementation before final class brace.
          # -----------------------------------------------------

          CALLS=$(grep -c 'addStableGame("' "$MAIN" || true)

          METHOD=$(grep -cE 'private[[:space:]]+void[[:space:]]+addStableGame[[:space:]]*\(' "$MAIN" || true)

          echo "Calls: $CALLS"
          echo "Method definitions: $METHOD"


          if [ "$CALLS" -gt 0 ] && [ "$METHOD" -eq 0 ]; then

            echo "Injecting missing addStableGame()..."

            python3 - "$MAIN" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

method = r'''

    /*
     * SADEE X DIMA
     * Stable game detection helper
     */
    private void addStableGame(String gameName, String packageName) {
        try {
            PackageManager pm = getPackageManager();

            boolean installed = false;

            try {
                pm.getPackageInfo(packageName, 0);
                installed = true;
            } catch (PackageManager.NameNotFoundException ignored) {
                installed = false;
            }

            if (!installed) {
                return;
            }

            Intent launchIntent =
                    pm.getLaunchIntentForPackage(packageName);

            if (launchIntent == null) {
                return;
            }

            launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

            Log.d(
                    "SADEE_GAME",
                    gameName + " detected: " + packageName
            );

        } catch (Exception e) {

            Log.e(
                    "SADEE_GAME",
                    "Game detection failed: " + gameName,
                    e
            );
        }
    }

'''

# Find final class closing brace.
pos = text.rfind("}")

if pos == -1:
    raise SystemExit("Could not find final class brace.")

text = text[:pos] + method + text[pos:]

with open(path, "w", encoding="utf-8") as f:
    f.write(text)

print("addStableGame() injected successfully.")
PY

          fi


      # =========================================================
      # AUTO ADD REQUIRED IMPORTS
      # =========================================================

      - name: Fix MainActivity imports
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          MAIN="$PROJECT/app/src/main/java/com/sadee/optimizer/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            MAIN=$(find "$PROJECT" \
              -type f \
              -name "MainActivity.java" \
              | head -n 1)
          fi

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi


          python3 - "$MAIN" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()


def add_import(text, imp):

    if imp in text:
        return text

    lines = text.splitlines()

    package_index = -1

    for i, line in enumerate(lines):
        if line.startswith("package "):
            package_index = i
            break

    if package_index == -1:
        return text

    lines.insert(package_index + 1, "")
    lines.insert(package_index + 2, imp)

    return "\n".join(lines) + "\n"


text = add_import(
    text,
    "import android.content.Intent;"
)

text = add_import(
    text,
    "import android.content.pm.PackageManager;"
)

text = add_import(
    text,
    "import android.util.Log;"
)


with open(path, "w", encoding="utf-8") as f:
    f.write(text)

print("MainActivity imports checked.")
PY


      # =========================================================
      # SHOW PATCHED FILE
      # =========================================================

      - name: Verify Java source
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          MAIN="$PROJECT/app/src/main/java/com/sadee/optimizer/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            MAIN=$(find "$PROJECT" \
              -type f \
              -name "MainActivity.java" \
              | head -n 1)
          fi

          echo "Checking:"
          echo "$MAIN"

          echo ""
          echo "addStableGame references:"
          grep -n "addStableGame" "$MAIN" || true

          echo ""
          echo "Required imports:"
          grep -nE \
            'import android\.content\.Intent|import android\.content\.pm\.PackageManager|import android\.util\.Log' \
            "$MAIN" || true


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          chmod +x ./gradlew

          echo "======================================"
          echo " BUILDING RELEASE APK"
          echo "======================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "BUILD FINISHED."


      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find Release APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -Ei "release.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | head -n 1)

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK not found."

            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # =========================================================
      # BUILD TOOLS
      # =========================================================

      - name: Find Build Tools
        id: tools
        shell: bash
        run: |
          set -e

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -d "$TOOLS" ]; then

            TOOLS=$(find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1)

          fi

          if [ -z "$TOOLS" ]; then
            echo "ERROR: Build tools not found."
            exit 1
          fi

          echo "BUILD TOOLS:"
          echo "$TOOLS"

          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"


      # =========================================================
      # SIGNING KEY
      # =========================================================

      - name: Create release signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"


      # =========================================================
      # SIGN APK
      # =========================================================

      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          TOOLS="${{ steps.tools.outputs.tools }}"

          mkdir -p signed

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            signed/aligned.apk

          "$TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/aligned.apk

          rm -f signed/aligned.apk


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          TOOLS="${{ steps.tools.outputs.tools }}"

          "$TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          ls -lh \
            signed/SADEE_X_DIMA_OPTIMIZER.apk


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # ADMIN DASHBOARD
      # =========================================================

      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "No admin dashboard found."
            exit 0
          fi

          rm -rf public

          mkdir -p public

          ADMIN_DIR="$(dirname "$ADMIN")"

          cp -r "$ADMIN_DIR"/. public/

          echo "Admin dashboard prepared."


      # =========================================================
      # DEPLOY ADMIN DASHBOARD
      # =========================================================

      - name: Deploy admin dashboard
        if: success() && hashFiles('public/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true


      # =========================================================
      # SUCCESS
      # =========================================================

      - name: Build Success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "        SADEE X DIMA BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP extracted       : OK"
          echo "Android project     : OK"
          echo "Java source check   : OK"
          echo "Gradle build        : OK"
          echo "Release APK         : OK"
          echo "APK signing         : OK"
          echo "APK verification    : OK"
          echo "Artifact upload     : OK"
          echo ""
          echo "APK:"
          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk
          echo ""
          echo "=============================================="
