name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - ".github/workflows/main.yml"
      - "SADEE_X_DIMA_USER_HOME_V6.dart"

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP + Build APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # --------------------------------------------------
      # 2. SHOW REPOSITORY FILES
      # --------------------------------------------------
      - name: Show Repository Files
        shell: bash
        run: |
          echo "======================================"
          echo "REPOSITORY CONTENT"
          echo "======================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      # --------------------------------------------------
      # 3. FIND ZIP
      # --------------------------------------------------
      - name: Find Flutter ZIP
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR ZIP"
          echo "======================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$file"
            fi
          done < <(
            find . -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP NOT FOUND"
            echo ""
            echo "Upload your Flutter ZIP to the ROOT of the repository."
            echo ""
            echo "Example:"
            echo "SADEE_X_DIMA_FIXED_FINAL.zip"
            echo ""
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. EXTRACT ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          echo "======================================"
          echo "EXTRACTING ZIP"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "EXTRACT COMPLETE"
          echo ""

          find extracted -maxdepth 4 -type f \
            | sort \
            | head -300

      # --------------------------------------------------
      # 5. FIND FLUTTER PROJECT
      # --------------------------------------------------
      - name: Detect Flutter Project
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR FLUTTER PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          while IFS= read -r pubspec; do

            DIR="$(dirname "$pubspec")"

            if [ -d "$DIR/android" ] && [ -d "$DIR/lib" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              ! -path "*/.dart_tool/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Flutter project NOT FOUND"
            echo ""
            echo "ZIP must contain:"
            echo "  pubspec.yaml"
            echo "  android/"
            echo "  lib/"
            echo ""
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "FLUTTER PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. SETUP FLUTTER
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # --------------------------------------------------
      # 7. SHOW FLUTTER VERSION
      # --------------------------------------------------
      - name: Flutter Doctor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter --version
          flutter doctor -v

      # --------------------------------------------------
      # 8. COPY V6 UI IF PRESENT
      # --------------------------------------------------
      - name: Install V6 UI
        shell: bash
        run: |
          V6_FILE=""

          if [ -f "SADEE_X_DIMA_USER_HOME_V6.dart" ]; then
            V6_FILE="SADEE_X_DIMA_USER_HOME_V6.dart"
          fi

          if [ -n "$V6_FILE" ]; then
            echo "V6 UI FOUND"

            mkdir -p "$PROJECT_DIR/lib/screens"

            cp "$V6_FILE" \
              "$PROJECT_DIR/lib/screens/user_home_v6.dart"

            echo "V6 UI copied."
          else
            echo "V6 UI file not found."
            echo "Using UI already inside ZIP."
          fi

      # --------------------------------------------------
      # 9. ENABLE ANDROIDX
      # --------------------------------------------------
      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p android

          if [ -f android/gradle.properties ]; then

            grep -q "android.useAndroidX=true" \
              android/gradle.properties \
              || echo "android.useAndroidX=true" \
              >> android/gradle.properties

            grep -q "android.enableJetifier=true" \
              android/gradle.properties \
              || echo "android.enableJetifier=true" \
              >> android/gradle.properties

          else

            cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096M
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          fi

      # --------------------------------------------------
      # 10. CLEAN
      # --------------------------------------------------
      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter clean

      # --------------------------------------------------
      # 11. PUB GET
      # --------------------------------------------------
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter pub get

      # --------------------------------------------------
      # 12. FORMAT
      # --------------------------------------------------
      - name: Dart Format
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          dart format lib || true

      # --------------------------------------------------
      # 13. ANALYZE
      # --------------------------------------------------
      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            || true

      # --------------------------------------------------
      # 14. CHECK PROJECT
      # --------------------------------------------------
      - name: Check Flutter Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT CHECK"
          echo "======================================"

          echo ""
          echo "pubspec:"
          test -f pubspec.yaml && echo "OK"

          echo ""
          echo "lib:"
          test -d lib && echo "OK"

          echo ""
          echo "android:"
          test -d android && echo "OK"

          echo ""
          echo "main files:"
          find lib -maxdepth 2 -type f \
            -name "*.dart" \
            | sort

      # --------------------------------------------------
      # 15. DETECT BUILD CONFIG
      # --------------------------------------------------
      - name: Detect Build Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          if [ -f "lib/main_user.dart" ]; then
            echo "MAIN_USER_FOUND=true" >> "$GITHUB_ENV"
            echo "User entrypoint found."
          else
            echo "MAIN_USER_FOUND=false" >> "$GITHUB_ENV"
            echo "User entrypoint NOT found."
          fi

          if [ -f "lib/main_admin.dart" ]; then
            echo "MAIN_ADMIN_FOUND=true" >> "$GITHUB_ENV"
            echo "Admin entrypoint found."
          else
            echo "MAIN_ADMIN_FOUND=false" >> "$GITHUB_ENV"
          fi

          if grep -Rqs "productFlavors" android/app 2>/dev/null; then
            echo "FLAVORS_FOUND=true" >> "$GITHUB_ENV"
            echo "Product flavors detected."
          else
            echo "FLAVORS_FOUND=false" >> "$GITHUB_ENV"
            echo "No product flavors detected."
          fi

      # --------------------------------------------------
      # 16. BUILD USER APK
      # --------------------------------------------------
      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          if [ "$FLAVORS_FOUND" = "true" ] && \
             [ "$MAIN_USER_FOUND" = "true" ]; then

            flutter build apk \
              --release \
              --flavor user \
              -t lib/main_user.dart

          elif [ "$MAIN_USER_FOUND" = "true" ]; then

            flutter build apk \
              --release \
              -t lib/main_user.dart

          else

            flutter build apk \
              --release

          fi

      # --------------------------------------------------
      # 17. FIND APK
      # --------------------------------------------------
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final-apk/SADEE-DIMA-OPTIMIZER-USER.apk"

          echo ""
          echo "APK READY:"
          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      # --------------------------------------------------
      # 18. BUILD ADMIN APK IF AVAILABLE
      # --------------------------------------------------
      - name: Build Admin APK
        if: env.MAIN_ADMIN_FOUND == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          if [ "$FLAVORS_FOUND" = "true" ]; then

            flutter build apk \
              --release \
              --flavor admin \
              -t lib/main_admin.dart

          else

            flutter build apk \
              --release \
              -t lib/main_admin.dart

          fi

          ADMIN_APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -n "$ADMIN_APK" ]; then

            cp "$ADMIN_APK" \
              "$GITHUB_WORKSPACE/final-apk/SADEE-DIMA-OPTIMIZER-ADMIN.apk"

          fi

      # --------------------------------------------------
      # 19. UPLOAD APK ARTIFACTS
      # --------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKS
          path: final-apk/
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 20. SHOW FINAL RESULT
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "        SADEE X DIMA BUILD"
          echo "             SUCCESS"
          echo "======================================"
          echo ""

          ls -lh final-apk/

          echo ""
          echo "APK files uploaded as GitHub Artifact."
          echo ""
