name: Extract Uploaded ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              ! -path "$GITHUB_WORKSPACE/.git/*"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo "ZIP extraction completed."

      - name: Show extracted files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " EXTRACTED PROJECT"
          echo "======================================"

          find extracted \
            -maxdepth 6 \
            -type f \
            | sort

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
          if-no-files-found: error
          retention-days: 7

      - name: Extraction success
        shell: bash
        run: |
          echo "======================================"
          echo " ZIP EXTRACT SUCCESS"
          echo "======================================"
          echo "The ZIP was found and extracted successfully."
