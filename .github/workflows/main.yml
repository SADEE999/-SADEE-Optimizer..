name: SADEE X DIMA - V3 BUILD & ADMIN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-v3
  cancel-in-progress: true

jobs:

  # =========================================================
  # ANDROID APK
  # =========================================================

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V3 ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "./SADEE_X_DIMA_V3_SINGLE_DASHBOARD.zip" ]; then
            ZIP_FILE="./SADEE_X_DIMA_V3_SINGLE_DASHBOARD.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "================================"
          echo "EXTRACTED PROJECT"
          echo "================================"

          find extracted -maxdepth 8 -type f | sort

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties || true
          sed -i '/^android.enableJetifier=/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat gradle.properties

      - name: Fix Gradle Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          cat settings.gradle

      - name: Check Resource Files
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          echo "Checking Android resources..."

          find app/src/main/res -type f -name "*.xml" | sort

          echo "Resource check complete."

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set +e

          echo "================================"
          echo "BUILDING APK"
          echo "================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "================================"
          echo "ERROR SUMMARY"
          echo "================================"

          grep -E \
            "FAILURE:|error:|Error:|Caused by:|Execution failed|AAPT|resource|Manifest" \
            build.log \
            | tail -200 || true

          echo ""
          echo "GRADLE EXIT CODE:"
          echo "$RESULT"

          exit "$RESULT"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V3-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # =========================================================
  # ADMIN DASHBOARD
  # =========================================================

  deploy-admin:
    name: Build & Publish Admin Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V3 ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "./SADEE_X_DIMA_V3_SINGLE_DASHBOARD.zip" ]; then
            ZIP_FILE="./SADEE_X_DIMA_V3_SINGLE_DASHBOARD.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: Admin dashboard not found"
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Website
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo "================================"
          echo "ADMIN FILES"
          echo "================================"

          find public -maxdepth 8 -type f | sort

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
