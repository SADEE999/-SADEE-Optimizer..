name: SADEE X DIMA ADVANCED V2 - FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "ZIP files in repository:"
          find . -maxdepth 3 -type f -iname "*.zip" -print || true

          ZIP="$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | sort | grep -Ei 'FULL_FIXED|FIXED|ADVANCED|GREEN' | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 3 -type f -iname "*.zip" ! -path "./.git/*" | sort | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::No project ZIP found. Upload the project ZIP to the repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          PROJECT="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/sadee/optimizer/Supabase.java"
          echo "Project verification OK."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Built: $APK"

      - name: Prepare Android SDK signing tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -v 4 "$PROJECT_DIR/$APK" signed-aligned.apk

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias sadee-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=SADEE X DIMA, OU=Mobile, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias sadee-release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out SADEE-X-DIMA-OPTIMIZER-release.apk \
            signed-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose SADEE-X-DIMA-OPTIMIZER-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADVANCED-V2-SIGNED-APK
          path: SADEE-X-DIMA-OPTIMIZER-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADVANCED-V2-BUILD-LOG
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy admin dashboard to GitHub Pages
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ADMIN="$(find "$PROJECT_DIR" -type f -path "*/admin-dashboard/index.html" | head -n 1 | xargs -r dirname)"

          if [ -z "$ADMIN" ]; then
            echo "No admin-dashboard found; skipping Pages deployment."
            exit 0
          fi

          rm -rf public
          mkdir -p public
          cp -R "$ADMIN"/. public/

          touch public/.nojekyll

      - name: Publish admin dashboard
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
