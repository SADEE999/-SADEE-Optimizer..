name: SADEE X DIMA - ZIP AUTO BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==================================================
      # JAVA
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # DO NOT USE android-actions/setup-android
      #
      # That action is trying to install the obsolete
      # "tools" package in your runner.
      #
      # GitHub ubuntu runner already contains Android SDK.
      # We use its sdkmanager directly.
      # ==================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"

          if [ -d "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          fi

          echo ""
          echo "Android SDK configured."

      # ==================================================
      # FIND SDKMANAGER
      # ==================================================
      - name: Find sdkmanager
        id: sdk
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      # ==================================================
      # INSTALL ONLY REQUIRED PACKAGES
      #
      # IMPORTANT:
      # NEVER install:
      # sdkmanager tools
      #
      # "tools" is obsolete and causes the exact error
      # from the previous workflow.
      # ==================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"

          echo "Accepting licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing platform-tools..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo ""
          echo "Installing Android platform 35..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          echo ""
          echo "Installing build tools 35.0.0..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # ==================================================
      # VERIFY SDK
      # ==================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification successful."

      # ==================================================
      # FIND ZIP
      # ==================================================
      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            ! -path "$GITHUB_WORKSPACE/extracted/*" \
            | sort \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "========================================="
            echo "ERROR: NO ZIP FILE FOUND"
            echo "========================================="

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ==================================================
      # EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "ZIP EXTRACTION COMPLETE"
          echo ""

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      # ==================================================
      # FIND ANDROID PROJECT
      # ==================================================
      - name: Detect Android project
        id: android
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"
          PROJECT=""

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then

            GRADLEW=$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1)

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi

          fi

          if [ -z "$PROJECT" ]; then

            BUILD_FILE=$(find "$ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT="$(dirname "$BUILD_FILE")"
            fi

          fi

          if [ -z "$PROJECT" ]; then
            echo "========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "========================================="

            find "$ROOT" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          echo "========================================="
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT"
          echo "========================================="

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==================================================
      # SETUP GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ==================================================
      # PREPARE GRADLE
      # ==================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            gradle wrapper \
              --gradle-version 8.7

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ==================================================
      # GRADLE PROPERTIES
      # ==================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          if [ ! -f gradle.properties ]; then
            touch gradle.properties
          fi

          grep -q '^org.gradle.jvmargs=' gradle.properties || \
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> gradle.properties

          grep -q '^org.gradle.daemon=' gradle.properties || \
            echo 'org.gradle.daemon=false' >> gradle.properties

          echo "Gradle configured."

      # ==================================================
      # CLEAN
      # ==================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==================================================
      # BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          cd "$PROJECT"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ==================================================
      # FIND APK
      # ==================================================
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | grep -Ei "release.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | head -n 1)

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND."

            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ==================================================
      # FIND BUILD TOOLS
      # ==================================================
      - name: Find Build Tools
        id: tools
        shell: bash
        run: |
          set -e

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -d "$TOOLS" ]; then
            TOOLS=$(find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1)
          fi

          if [ -z "$TOOLS" ]; then
            echo "ERROR: Build tools not found."
            exit 1
          fi

          echo "BUILD TOOLS:"
          echo "$TOOLS"

          echo "build_tools=$TOOLS" >> "$GITHUB_OUTPUT"

      # ==================================================
      # CREATE TEMPORARY SIGNING KEY
      # ==================================================
      - name: Create signing key
        shell: bash
        run: |
          set -e

          rm -rf signing
          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      # ==================================================
      # ALIGN + SIGN
      # ==================================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk }}"
          TOOLS="${{ steps.tools.outputs.build_tools }}"

          rm -rf signed
          mkdir -p signed

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            signed/aligned.apk

          "$TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out signed/SADEE_X_DIMA_OPTIMIZER.apk \
            signed/aligned.apk

          rm -f signed/aligned.apk

          echo "APK SIGNED."

      # ==================================================
      # VERIFY APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          TOOLS="${{ steps.tools.outputs.build_tools }}"

          "$TOOLS/apksigner" verify \
            --verbose \
            signed/SADEE_X_DIMA_OPTIMIZER.apk

          echo ""
          echo "APK SIGNATURE VERIFIED"
          echo ""

          ls -lh signed/SADEE_X_DIMA_OPTIMIZER.apk

      # ==================================================
      # UPLOAD ONLY THE APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: signed/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # FIND ADMIN DASHBOARD
      # ==================================================
      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project }}"

          ADMIN=$(find "$PROJECT" \
            -type f \
            -path "*/admin-dashboard/index.html" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then
            echo "Admin dashboard not found."
            exit 0
          fi

          rm -rf public
          mkdir -p public

          ADMIN_DIR="$(dirname "$ADMIN")"

          cp -r "$ADMIN_DIR"/. public/

          echo "ADMIN DASHBOARD READY"

      # ==================================================
      # DEPLOY ADMIN DASHBOARD
      # ==================================================
      - name: Deploy admin dashboard
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false

      # ==================================================
      # FINAL SUCCESS
      # ==================================================
      - name: Build Success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SADEE X DIMA BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP extracted successfully."
          echo "Android project detected."
          echo "APK built successfully."
          echo "APK signed successfully."
          echo "APK verified successfully."
          echo "APK uploaded successfully."
          echo ""
          echo "=============================================="
