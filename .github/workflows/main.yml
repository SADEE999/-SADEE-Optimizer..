name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find ZIP uploaded to GitHub
      - name: Find Project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 3. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "${{ steps.find_zip.outputs.zip_file }}"

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "===== EXTRACTED PROJECT ====="

          find extracted -maxdepth 4 -type f | head -300

      # 4. Find Android project
      - name: Find Android Project
        id: android_project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT=""

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT=$(cd "$PROJECT" && pwd)

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # 5. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 6. Setup Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 7. Configure AndroidX
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX configured."

      # 8. Force Gradle Wrapper to 8.7
      - name: Update Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          if [ -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Updating Gradle Wrapper to 8.7..."

            sed -i \
              's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.7-\1.zip#g' \
              "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

            echo "===== GRADLE WRAPPER ====="
            cat "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          fi

      # 9. Make gradlew executable
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
          fi

      # 10. Fix common Android project problems
      - name: Fix Android Project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          echo "===== Fixing Android resources ====="

          # hintTextColor -> textColorHint
          find "$PROJECT/app/src/main/res" \
            -type f \
            -name "*.xml" \
            -exec sed -i \
            's/android:hintTextColor=/android:textColorHint=/g' {} \; \
            || true

          # Move nav_colors selector from values to color
          if [ -f "$PROJECT/app/src/main/res/values/nav_colors.xml" ]; then

            mkdir -p "$PROJECT/app/src/main/res/color"

            mv \
              "$PROJECT/app/src/main/res/values/nav_colors.xml" \
              "$PROJECT/app/src/main/res/color/nav_colors.xml"

            echo "nav_colors.xml moved."

          fi

          echo "===== Fixing Java imports ====="

          while IFS= read -r FILE; do

            if grep -q "class Page5InjectorFragment" "$FILE"; then

              if ! grep -q "import android.os.Bundle;" "$FILE"; then

                sed -i \
                  '/^package /a import android.os.Bundle;' \
                  "$FILE"

              fi

            fi

          done < <(
            find "$PROJECT/app/src/main/java" \
              -type f \
              -name "*.java"
          )

      # 11. Build using Gradle 8.7
      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.android_project.outputs.project }}"

          cd "$PROJECT"

          echo "================================="
          echo "SADEE X DIMA APK BUILD"
          echo "================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Cleaning project..."

          gradle clean \
            --stacktrace

          echo ""
          echo "Building APK..."

          gradle assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "BUILD EXIT CODE: $STATUS"

          exit "$STATUS"

      # 12. Find generated APK
      - name: Find APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find extracted \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 13. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      # 14. Upload build log
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: build.log
          if-no-files-found: warn

      # 15. Find Admin Dashboard
      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=""

          # Preferred folder
          if [ -d "extracted/admin-dashboard" ]; then
            ADMIN="extracted/admin-dashboard"
          fi

          # Search for index.html
          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -n "$INDEX" ]; then
              ADMIN=$(dirname "$INDEX")
            fi

          fi

          if [ -z "$ADMIN" ]; then

            echo "No admin dashboard found."

            echo "found=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "ADMIN DASHBOARD:"
          echo "$ADMIN"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$ADMIN" >> "$GITHUB_OUTPUT"

      # 16. Prepare Admin
      - name: Prepare Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.path }}/." \
            public/

          echo "===== ADMIN FILES ====="

          find public \
            -maxdepth 3 \
            -type f \
            | sort

      # 17. Deploy Admin to GitHub Pages
      - name: Deploy Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy SADEE X DIMA Admin Dashboard"
