name: SADEE X DIMA - AUTO BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build:
    name: Extract ZIP + Build APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true


      # ==================================================
      # 2. SHOW FILES
      # ==================================================

      - name: Show Repository
        shell: bash
        run: |
          echo "========================================"
          echo "SADEE X DIMA"
          echo "REPOSITORY FILES"
          echo "========================================"

          find . \
            -maxdepth 4 \
            -type f \
            ! -path "./.git/*" \
            | sort


      # ==================================================
      # 3. FIND ZIP
      # ==================================================

      - name: Find ZIP
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCHING FOR ZIP"
          echo "========================================"

          ZIP_FILE=""

          while IFS= read -r FILE
          do

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$FILE"
            fi

          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "❌ ZIP NOT FOUND"
            echo ""

            echo "GitHub repository currently contains:"
            find . \
              -maxdepth 3 \
              -type f \
              ! -path "./.git/*" \
              | sort

            echo ""
            echo "Upload the ZIP to repository root."
            echo ""
            echo "Example:"
            echo "SADEE_X_DIMA_OPTIMIZER_PROJECT.zip"

            exit 1

          fi

          echo ""
          echo "✅ ZIP FOUND:"
          echo "$ZIP_FILE"
          echo ""

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 4. TEST ZIP
      # ==================================================

      - name: Test ZIP
        shell: bash
        run: |

          echo "========================================"
          echo "TESTING ZIP"
          echo "========================================"

          unzip -t "$ZIP_FILE"

          echo ""
          echo "✅ ZIP TEST PASSED"


      # ==================================================
      # 5. EXTRACT ZIP
      # ==================================================

      - name: Extract ZIP
        shell: bash
        run: |

          echo "========================================"
          echo "EXTRACTING ZIP"
          echo "========================================"

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "✅ EXTRACTION COMPLETE"
          echo ""

          find extracted \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # ==================================================
      # 6. DETECT FLUTTER PROJECT
      # ==================================================

      - name: Detect Flutter Project
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCHING FOR FLUTTER PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r PUBSPEC
          do

            DIR="$(dirname "$PUBSPEC")"

            if [ -d "$DIR/lib" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              ! -path "*/.dart_tool/*" \
              | sort
          )


          # ------------------------------------------------
          # If pubspec not found, check whether V6 file
          # exists and create Flutter project automatically.
          # ------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            V6_FILE="$(
              find extracted \
                -type f \
                -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
                | head -n 1
            )"

            if [ -n "$V6_FILE" ]; then

              echo ""
              echo "V6 FILE FOUND."
              echo "Creating Flutter project automatically."

              PROJECT_DIR="$GITHUB_WORKSPACE/generated_project"

              mkdir -p "$PROJECT_DIR"

              cd "$PROJECT_DIR"

              flutter create . \
                --project-name sadee_x_dima_optimizer \
                --platforms=android

              mkdir -p "$PROJECT_DIR/lib/screens"

              cp "$V6_FILE" \
                "$PROJECT_DIR/lib/screens/user_home_v6.dart"

            fi

          fi


          # ------------------------------------------------
          # FINAL CHECK
          # ------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "❌ FLUTTER PROJECT NOT FOUND"
            echo ""
            echo "ZIP must contain either:"
            echo ""
            echo "pubspec.yaml + lib/"
            echo ""
            echo "OR:"
            echo ""
            echo "SADEE_X_DIMA_USER_HOME_V6.dart"

            exit 1

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "========================================"
          echo "FLUTTER PROJECT FOUND"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 7. SETUP FLUTTER
      # ==================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ==================================================
      # 8. FLUTTER VERSION
      # ==================================================

      - name: Flutter Version
        shell: bash
        run: |

          flutter --version

          flutter doctor -v


      # ==================================================
      # 9. CREATE ANDROID IF MISSING
      # ==================================================

      - name: Repair Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [ ! -d "android" ]; then

            echo "Android folder missing."
            echo "Creating Android project..."

            flutter create . \
              --platforms=android

          else

            echo "Android folder already exists."

          fi


      # ==================================================
      # 10. INSTALL V6 UI
      # ==================================================

      - name: Install V6 UI
        shell: bash
        run: |

          echo "========================================"
          echo "INSTALLING V6 UI"
          echo "========================================"

          V6_FILE=""

          if [ -f "SADEE_X_DIMA_USER_HOME_V6.dart" ]; then

            V6_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart"

          else

            V6_FILE="$(
              find extracted \
                -type f \
                -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
                | head -n 1
            )"

          fi


          if [ -n "$V6_FILE" ] && [ -f "$V6_FILE" ]; then

            mkdir -p "$PROJECT_DIR/lib/screens"

            cp "$V6_FILE" \
              "$PROJECT_DIR/lib/screens/user_home_v6.dart"

            echo "✅ V6 UI installed."

          else

            echo "V6 UI file not found."
            echo "Using existing project UI."

          fi


      # ==================================================
      # 11. CREATE MAIN DART IF NEEDED
      # ==================================================

      - name: Create Main Dart
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          if [ ! -f "lib/main.dart" ]; then

            echo "Creating main.dart"

            cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'screens/user_home_v6.dart';

          void main() {
            runApp(const SadeeDimaApp());
          }

          class SadeeDimaApp extends StatelessWidget {
            const SadeeDimaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'SADEE X DIMA OPTIMIZER',
                theme: ThemeData.dark(
                  useMaterial3: true,
                ),
                home: const UserHomeScreen(),
              );
            }
          }
          EOF

          fi


      # ==================================================
      # 12. ANDROIDX
      # ==================================================

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          mkdir -p android

          touch android/gradle.properties

          grep -q \
            "android.useAndroidX=true" \
            android/gradle.properties \
            || echo \
            "android.useAndroidX=true" \
            >> android/gradle.properties

          grep -q \
            "android.enableJetifier=true" \
            android/gradle.properties \
            || echo \
            "android.enableJetifier=true" \
            >> android/gradle.properties


      # ==================================================
      # 13. CLEAN
      # ==================================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          flutter clean


      # ==================================================
      # 14. PUB GET
      # ==================================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          flutter pub get


      # ==================================================
      # 15. FORMAT
      # ==================================================

      - name: Dart Format
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          dart format lib || true


      # ==================================================
      # 16. ANALYZE
      # ==================================================

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            || true


      # ==================================================
      # 17. BUILD APK
      # ==================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "BUILDING SADEE X DIMA APK"
          echo "========================================"

          flutter build apk \
            --release


      # ==================================================
      # 18. FIND APK
      # ==================================================

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find build \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find build \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "❌ APK NOT FOUND"

            exit 1

          fi


          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER.apk"


          echo ""
          echo "========================================"
          echo "APK READY"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/final-apk/"


      # ==================================================
      # 19. UPLOAD APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: final-apk/SADEE-X-DIMA-OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 20. FINAL SUMMARY
      # ==================================================

      - name: Build Summary
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "       SADEE X DIMA OPTIMIZER"
          echo "=========================================="
          echo ""
          echo "             BUILD SUCCESS"
          echo ""
          echo "APK:"
          ls -lh final-apk/
          echo ""
          echo "Download:"
          echo "GitHub Actions → Artifacts"
          echo ""
          echo "=========================================="
