name: SADEE X DIMA - Extract ZIP & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. FIND ZIP IN REPOSITORY ROOT
      # --------------------------------------------------
      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r -d '' FILE; do
            ZIP_FILE="$FILE"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              ! -path "*/.git/*" \
              -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 4. TEST ZIP
      # --------------------------------------------------
      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip }}"

          echo "Testing ZIP..."
          unzip -t "$ZIP"

          echo "ZIP is valid."

      # --------------------------------------------------
      # 5. EXTRACT ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip }}"
          EXTRACTED="$GITHUB_WORKSPACE/extracted"

          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q -o "$ZIP" -d "$EXTRACTED"

          FILE_COUNT="$(
            find "$EXTRACTED" \
              -type f \
              | wc -l
          )"

          echo ""
          echo "Extracted files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: ZIP extracted zero files."
            exit 1
          fi

          echo ""
          echo "EXTRACTION SUCCESS."

      # --------------------------------------------------
      # 6. SHOW EXTRACTED STRUCTURE
      # --------------------------------------------------
      - name: Show extracted project
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "EXTRACTED PROJECT"
          echo "================================"

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -print \
            | head -n 300

      # --------------------------------------------------
      # 7. DETECT ANDROID PROJECT
      # --------------------------------------------------
      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/extracted"
          PROJECT=""

          echo "Searching for Android Gradle project..."

          while IFS= read -r SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
          )

          if [ -z "$PROJECT" ]; then

            while IFS= read -r GRADLEW; do

              DIR="$(dirname "$GRADLEW")"

              if [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; then

                PROJECT="$DIR"
                break

              fi

            done < <(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -print
            )

          fi

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: Android project not found."
            echo ""
            find "$ROOT" -maxdepth 7 -print
            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 8. DETECT APP MODULE
      # --------------------------------------------------
      - name: Detect Android app module
        id: module
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          MODULE=""

          if [ -d "$PROJECT/app" ]; then

            MODULE="$PROJECT/app"

          else

            while IFS= read -r MANIFEST; do

              DIR="$(dirname "$MANIFEST")"

              if [ -f "$DIR/../../build.gradle" ] || \
                 [ -f "$DIR/../../build.gradle.kts" ]; then

                MODULE="$(realpath "$DIR/../..")"
                break

              fi

            done < <(
              find "$PROJECT" \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -print
            )

          fi

          if [ -z "$MODULE" ] || [ ! -d "$MODULE" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          MODULE="$(realpath "$MODULE")"

          echo ""
          echo "ANDROID APP MODULE:"
          echo "$MODULE"

          echo "module=$MODULE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3
      # Do NOT install sdkmanager package "tools"
      # --------------------------------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                | head -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          # ONLY install required packages.
          # DO NOT install obsolete "tools".
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK READY."

      # --------------------------------------------------
      # 10. GRADLE
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 11. GRADLE CONFIG
      # --------------------------------------------------
      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          touch gradle.properties

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
              >> gradle.properties
          fi

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=false" \
              >> gradle.properties
          fi

      # --------------------------------------------------
      # 12. GRADLE WRAPPER
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

          else

            echo "Gradle wrapper missing."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper --gradle-version 8.7

              chmod +x ./gradlew

            else

              echo "ERROR: Gradle is not installed."
              exit 1

            fi

          fi

          ./gradlew --version

      # --------------------------------------------------
      # 13. CLEAN
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 14. BUILD RELEASE APK
      # --------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          echo "================================"
          echo "BUILDING RELEASE APK"
          echo "================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "RELEASE BUILD SUCCESS."

      # --------------------------------------------------
      # 15. FIND APK
      # --------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          MODULE="${{ steps.module.outputs.module }}"

          APK=""

          if [ -d "$MODULE/build/outputs" ]; then

            APK="$(
              find "$MODULE/build/outputs" \
                -type f \
                -name "*.apk" \
                -print \
                | grep -Ei "/release/.*\.apk$" \
                | head -n 1 || true
            )

          fi

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT" \
                -type f \
                -name "*.apk" \
                -print \
                | grep -Ei "/release/.*\.apk$" \
                | head -n 1 || true
            )

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find "$PROJECT" \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          APK="$(realpath "$APK")"

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 16. CREATE TEMPORARY SIGNING KEY
      # --------------------------------------------------
      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          SIGN_DIR="$RUNNER_TEMP/sadee-signing"

          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          keytool \
            -genkeypair \
            -v \
            -keystore "$SIGN_DIR/release.keystore" \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

      # --------------------------------------------------
      # 17. ALIGN + SIGN
      # --------------------------------------------------
      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"

          TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          "$TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/sadee-signing/release.keystore" \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out "$GITHUB_WORKSPACE/final-apk/SADEE_X_DIMA_OPTIMIZER.apk" \
            "$RUNNER_TEMP/aligned.apk"

      # --------------------------------------------------
      # 18. VERIFY APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          APK="$GITHUB_WORKSPACE/final-apk/SADEE_X_DIMA_OPTIMIZER.apk"

          "$TOOLS/apksigner" verify \
            --verbose \
            "$APK"

          ls -lh "$APK"

      # --------------------------------------------------
      # 19. UPLOAD ONLY APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ github.workspace }}/final-apk/SADEE_X_DIMA_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 20. SUCCESS
      # --------------------------------------------------
      - name: Build success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA OPTIMIZER BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "ZIP: FOUND"
          echo "ZIP: EXTRACTED"
          echo "ANDROID PROJECT: DETECTED"
          echo "ANDROID SDK: READY"
          echo "APK: BUILT"
          echo "APK: SIGNED"
          echo "APK: VERIFIED"
          echo ""
          echo "ADMIN PANEL: NOT MODIFIED"
          echo "ADMIN PANEL: NOT DEPLOYED"
          echo ""
          echo "=============================================="
