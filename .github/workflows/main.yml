name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 4 -type f | head -200

      - name: Find Android project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle' \
            -o -type f -name 'settings.gradle.kts' \
            | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "gradle.properties created."

      - name: Fix Gradle repository mode
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          if [ -f "$PROJECT/settings.gradle" ]; then
            python3 - "$PROJECT/settings.gradle" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          if "pluginManagement" not in s:
              s = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          """ + s

          if "import org.gradle.api.initialization.resolve.RepositoriesMode" not in s:
              s = "import org.gradle.api.initialization.resolve.RepositoriesMode\n" + s

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)
          PY
          fi

      - name: Fix known Android source files
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          echo "===== Searching Java files ====="
          find "$PROJECT/app/src/main/java" -type f -name "*.java" -print || true

          echo "===== Fix Bundle import ====="

          while IFS= read -r FILE; do
            if grep -q "class Page5InjectorFragment" "$FILE"; then

              if ! grep -q "import android.os.Bundle;" "$FILE"; then
                sed -i '/^package /a import android.os.Bundle;' "$FILE"
              fi

            fi
          done < <(find "$PROJECT/app/src/main/java" -type f -name "*.java")

          echo "===== Fix XML hintTextColor ====="

          while IFS= read -r FILE; do
            sed -i 's/android:hintTextColor=/android:textColorHint=/g' "$FILE"
          done < <(find "$PROJECT/app/src/main/res" -type f -name "*.xml")

          echo "===== Fix XML ampersand ====="

          while IFS= read -r FILE; do
            sed -i 's/ & / \&amp; /g' "$FILE"
          done < <(find "$PROJECT/app/src/main/res" -type f -name "*.xml")

          echo "===== Fix nav_colors.xml location ====="

          if [ -f "$PROJECT/app/src/main/res/values/nav_colors.xml" ]; then
            mkdir -p "$PROJECT/app/src/main/res/color"

            mv \
              "$PROJECT/app/src/main/res/values/nav_colors.xml" \
              "$PROJECT/app/src/main/res/color/nav_colors.xml"

            echo "Moved nav_colors.xml to res/color/"
          fi

      - name: Fix Java 17 compatibility
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          echo "===== Fix javax.xml.bind ====="

          while IFS= read -r FILE; do

            if grep -q "javax.xml.bind.DatatypeConverter" "$FILE"; then

              python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          old = r"javax\.xml\.bind\.DatatypeConverter\.parseDateTime\(([^)]*)\)\.getTimeInMillis\(\)"

          def repl(match):
              value = match.group(1)
              return (
                  "java.time.OffsetDateTime.parse("
                  + value
                  + ").toInstant().toEpochMilli()"
              )

          s = re.sub(old, repl, s)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)
          PY

            fi

          done < <(find "$PROJECT/app/src/main/java" -type f -name "*.java")

          echo "===== Fix getCodeCache usage ====="

          while IFS= read -r FILE; do

            if grep -q "getCodeCache()" "$FILE"; then
              sed -i 's/getCodeCache()/getCacheDir()/g' "$FILE"
            fi

          done < <(find "$PROJECT/app/src/main/java" -type f -name "*.java")

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          echo "===== PROJECT ====="
          echo "$PROJECT"

          echo "===== SETTINGS ====="
          cat "$PROJECT/settings.gradle" || true

          echo "===== APP BUILD ====="
          cat "$PROJECT/app/build.gradle" || true

          echo "===== JAVA VERSION ====="
          java -version

      - name: Clean build
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project }}"

          cd "$PROJECT"

          gradle --version

          gradle clean --stacktrace

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.android_project.outputs.project }}"

          cd "$PROJECT"

          gradle assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo "Build exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            exit "$STATUS"
          fi

      - name: Find APK
        id: find_apk
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(find extracted -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: build.log
          if-no-files-found: warn

      - name: Find Admin Dashboard
        id: find_admin
        shell: bash
        run: |
          set -e

          ADMIN_DIR=""

          if [ -d "extracted/admin-dashboard" ]; then
            ADMIN_DIR="extracted/admin-dashboard"
          fi

          if [ -z "$ADMIN_DIR" ]; then
            INDEX="$(find extracted -type f -name 'index.html' | head -n 1)"

            if [ -n "$INDEX" ]; then
              ADMIN_DIR="$(dirname "$INDEX")"
            fi
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "No admin dashboard found."
            echo "admin_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Admin dashboard:"
          echo "$ADMIN_DIR"

          echo "admin_found=true" >> "$GITHUB_OUTPUT"
          echo "admin_dir=$ADMIN_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Admin Dashboard
        if: success() && steps.find_admin.outputs.admin_found == 'true'
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R "${{ steps.find_admin.outputs.admin_dir }}/." public/

          echo "===== ADMIN FILES ====="
          find public -maxdepth 3 -type f | sort

      - name: Deploy Admin Dashboard
        if: success() && steps.find_admin.outputs.admin_found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy SADEE X DIMA Admin Dashboard"
