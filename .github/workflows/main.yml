name: SADEE X DIMA - Extract ZIP & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Find ZIP uploaded to GitHub
      - name: Find uploaded ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "=============================="
          echo "EXTRACTING UPLOADED ZIP"
          echo "=============================="

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "EXTRACTION COMPLETE"

          find extracted -maxdepth 5 -type f | head -200

      # Find Android project automatically
      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -type f \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"

            find extracted -maxdepth 6 -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Use runner's already installed Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_SDK_ROOT"

      # Install only real SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
              -name sdkmanager \
              -type f \
              | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build
      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "=============================="
          echo "BUILDING SADEE X DIMA APK"
          echo "=============================="

          ./gradlew clean assembleRelease --stacktrace

      # Find generated APK
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: RELEASE APK NOT FOUND"

            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk"

            exit 1
          fi

          APK=$(realpath "$APK")

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
