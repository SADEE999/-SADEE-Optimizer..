name: SADEE X DIMA FINAL - BUILD APK + ADMIN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-final
  cancel-in-progress: true

jobs:
  build:
    name: Build Android + Deploy Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find Uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "SEARCHING FOR SADEE X DIMA ZIP"
          echo "========================================"

          ZIP_FILE="$(find . -type f -iname '*.zip' ! -path './.git/*' | sort | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            echo "Upload SADEE_X_DIMA_GREEN_GAMING_FINAL.zip to repository root."
            find . -maxdepth 3 -type f ! -path './.git/*' | sort
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -oq "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "EXTRACTED FILES:"
          find extracted -maxdepth 5 -type f | sort | head -500

      - name: Locate Android Project
        id: android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | sort | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: Android app directory not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android Build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E \
              's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.7-\1.zip#g' \
              gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Verify Original App
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sadee/optimizer/MainActivity.java
          test -f app/src/main/java/com/sadee/optimizer/Supabase.java
          test -f app/src/main/java/com/sadee/optimizer/DeviceInfo.java
          test -f app/src/main/java/com/sadee/optimizer/Config.java
          test -f app/src/main/res/drawable/sadee_logo.jpg

          echo "Original app structure OK."

      - name: Build Release APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING SADEE X DIMA FINAL APK"
          echo "========================================"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee build.log

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FINAL-APK
          path: ${{ steps.android.outputs.project }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Locate Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN="$(find extracted -type f \
            -path '*/admin-dashboard/index.html' \
            -print | sort | head -n 1)"

          if [ -z "$ADMIN" ]; then
            ADMIN_FILE="$(find extracted -type f \
              -name index.html \
              ! -path '*/node_modules/*' | sort | head -n 1)"

            if [ -z "$ADMIN_FILE" ]; then
              echo "ERROR: admin index.html not found."
              exit 1
            fi

            ADMIN="$(dirname "$ADMIN_FILE")"
          else
            ADMIN="$(dirname "$ADMIN")"
          fi

          echo "ADMIN=$ADMIN"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R "${{ steps.admin.outputs.admin }}/." public/

          touch public/.nojekyll

          echo "ADMIN FILES:"
          find public -maxdepth 2 -type f | sort

      - name: Deploy Admin Dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy SADEE X DIMA Admin Dashboard"

      - name: Build Complete
        run: |
          echo "========================================"
          echo "SADEE X DIMA FINAL BUILD SUCCESS"
          echo "APK -> Actions / Artifacts"
          echo "ADMIN -> gh-pages"
          echo "========================================"
