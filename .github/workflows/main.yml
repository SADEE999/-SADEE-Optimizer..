name: SADEE X DIMA - AUTO BUILD FIXED

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Repair and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -type f -iname '*.zip' ! -path './.git/*' | sort | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Upload the Flutter ZIP to the repository and commit it."
            find . -maxdepth 3 -type f ! -path './.git/*' | sort
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -300

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' | sort | head -n 1)"

          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            V6_FILE="$(find extracted -type f -name 'SADEE_X_DIMA_USER_HOME_V6.dart' | head -n 1)"

            if [ -n "$V6_FILE" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/generated_project"
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              flutter create . --project-name sadee_x_dima_optimizer --platforms android
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT: $PROJECT_DIR"

      - name: Install V6 UI
        shell: bash
        run: |
          set -e

          V6_FILE=""

          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart" ]; then
            V6_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart"
          else
            V6_FILE="$(find extracted -type f -name 'SADEE_X_DIMA_USER_HOME_V6.dart' | head -n 1)"
          fi

          if [ -n "$V6_FILE" ] && [ -f "$V6_FILE" ]; then
            mkdir -p "$PROJECT_DIR/lib/screens"
            cp "$V6_FILE" "$PROJECT_DIR/lib/screens/user_home_v6.dart"
            echo "V6 UI installed."
          else
            echo "V6 UI file not found. Keeping project UI."
          fi

      - name: Repair Old Android Embedding
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          OLD=false

          if [ -d android ]; then
            if grep -Rqs 'io.flutter.app.FlutterActivity' android 2>/dev/null; then
              OLD=true
            fi

            if grep -Rqs 'io.flutter.app.FlutterApplication' android 2>/dev/null; then
              OLD=true
            fi

            if grep -Rqs 'PluginRegistry.Registrar' android 2>/dev/null; then
              OLD=true
            fi
          fi

          if [ "$OLD" = "true" ]; then
            echo "Old Android V1 embedding detected."
            rm -rf android
            flutter create . --project-name sadee_x_dima_optimizer --platforms android
            echo "Android project regenerated with current Flutter embedding."
          elif [ ! -d android ]; then
            echo "Android folder missing. Creating it."
            flutter create . --project-name sadee_x_dima_optimizer --platforms android
          else
            echo "Android project is present."
          fi

      - name: Create Main Dart When Needed
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f lib/main.dart ] && [ -f lib/screens/user_home_v6.dart ]; then
            printf '%s\\n' \\
              "import 'package:flutter/material.dart';" \\
              "import 'screens/user_home_v6.dart';" \\
              "" \\
              "void main() {" \\
              "  runApp(const SadeeDimaApp());" \\
              "}" \\
              "" \\
              "class SadeeDimaApp extends StatelessWidget {" \\
              "  const SadeeDimaApp({super.key});" \\
              "" \\
              "  @override" \\
              "  Widget build(BuildContext context) {" \\
              "    return MaterialApp(" \\
              "      debugShowCheckedModeBanner: false," \\
              "      title: 'SADEE X DIMA OPTIMIZER'," \\
              "      theme: ThemeData.dark(useMaterial3: true)," \\
              "      home: const UserHomeScreen()," \\
              "    );" \\
              "  }" \\
              "}" > lib/main.dart
          fi

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch android/gradle.properties

          grep -q '^android.useAndroidX=true$' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=true$' android/gradle.properties \
            || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Verify Android V2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if grep -Rqs 'io.flutter.app.FlutterActivity' android/app/src/main 2>/dev/null; then
            echo "ERROR: Old FlutterActivity still exists."
            exit 1
          fi

          if grep -Rqs 'io.flutter.app.FlutterApplication' android/app/src/main 2>/dev/null; then
            echo "ERROR: Old FlutterApplication still exists."
            exit 1
          fi

          if grep -Rqs 'PluginRegistry.Registrar' android/app/src/main 2>/dev/null; then
            echo "ERROR: Old PluginRegistry still exists."
            exit 1
          fi

          echo "Android V2 embedding check passed."

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Dart Format
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart format lib || true

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find build -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER.apk"

          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: final-apk/SADEE-X-DIMA-OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Success
        run: |
          echo "========================================"
          echo "SADEE X DIMA OPTIMIZER"
          echo "BUILD SUCCESS"
          echo "========================================"
