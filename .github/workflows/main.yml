name: SADEE X DIMA V6 - BUILD APK + ADMIN

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - "**.dart"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-v6
  cancel-in-progress: true

jobs:

  build-apk-and-admin:

    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # =========================================================
      # 3. FIND ZIP + EXTRACT
      # =========================================================

      - name: Find and Extract Flutter Project
        id: project
        shell: bash
        run: |

          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT="$ROOT/extracted_project"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "=========================================="
          echo "SEARCHING FOR SADEE X DIMA PROJECT"
          echo "=========================================="

          # If repository itself is Flutter project
          if [ -f "$ROOT/pubspec.yaml" ]; then

            PROJECT_DIR="$ROOT"

            echo "Flutter project found directly in repository."

          else

            ZIP_FILE="$(
              find "$ROOT" \
                -type f \
                -iname "*.zip" \
                ! -path "*/.git/*" \
                ! -path "*/extracted_project/*" \
                -print \
                | head -n 1
            )"

            if [ -z "$ZIP_FILE" ]; then

              echo "::error::No Flutter ZIP found."
              echo ""
              echo "Repository files:"
              find "$ROOT" \
                -maxdepth 4 \
                -type f \
                ! -path "*/.git/*" \
                | sort \
                | head -300

              exit 1

            fi

            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            unzip -q -o "$ZIP_FILE" -d "$EXTRACT"

            PUBSPEC="$(
              find "$EXTRACT" \
                -type f \
                -name "pubspec.yaml" \
                ! -path "*/.git/*" \
                -print \
                | head -n 1
            )"

            if [ -z "$PUBSPEC" ]; then

              echo "::error::pubspec.yaml not found inside ZIP."

              unzip -l "$ZIP_FILE" | head -300

              exit 1

            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"

          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=========================================="
          echo "PROJECT:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 4. VERIFY PROJECT
      # =========================================================

      - name: Verify Flutter Project
        shell: bash
        run: |

          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml

          if [ ! -f lib/main_user.dart ]; then
            echo "::error::lib/main_user.dart not found."
            exit 1
          fi

          if [ ! -f lib/main_admin.dart ]; then
            echo "::error::lib/main_admin.dart not found."
            exit 1
          fi

          if [ ! -d android ]; then
            echo "::error::Android folder not found."
            exit 1
          fi

          echo "Flutter project verified."

          echo ""
          echo "PROJECT FILES:"
          find lib -maxdepth 3 -type f | sort | head -300


      # =========================================================
      # 5. APPLY V6 USER HOME
      # =========================================================

      - name: Install V6 User Home
        shell: bash
        run: |

          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          V6_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -name "SADEE_X_DIMA_USER_HOME_V6.dart" \
                -o \
                -name "user_home_fixed.dart" \
              \) \
              ! -path "*/.git/*" \
              ! -path "*/extracted_project/*" \
              -print \
              | head -n 1
          )"

          if [ -z "$V6_FILE" ]; then

            echo "V6 Dart file not found."
            echo "Using source already contained in ZIP."

          else

            echo "V6 SOURCE FOUND:"
            echo "$V6_FILE"

            cd "$PROJECT_DIR"

            mkdir -p lib/screens

            # Prefer user_home.dart if it exists
            if [ -f lib/screens/user_home.dart ]; then

              cp "$V6_FILE" lib/screens/user_home.dart

              echo "Installed V6 -> lib/screens/user_home.dart"

            elif [ -f lib/screens/user_home_fixed.dart ]; then

              cp "$V6_FILE" lib/screens/user_home_fixed.dart

              echo "Installed V6 -> lib/screens/user_home_fixed.dart"

            else

              cp "$V6_FILE" lib/screens/user_home.dart

              echo "Created lib/screens/user_home.dart"

            fi

          fi


      # =========================================================
      # 6. FLUTTER DEPENDENCIES
      # =========================================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -e

          flutter clean


      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -e

          flutter pub get


      # =========================================================
      # 7. SAFE DART REPAIR
      # =========================================================

      - name: Repair Dart Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          from pathlib import Path

          files = list(Path("lib").rglob("*.dart"))

          print("Checking Dart files:", len(files))

          for p in files:

              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              # Common syntax repair
              text = text.replace(
                  "c=='temp'?.5:1",
                  "c == 'temp' ? .5 : 1"
              )

              text = text.replace(
                  "c == 'temp'?.5:1",
                  "c == 'temp' ? .5 : 1"
              )

              text = text.replace(
                  "c == 'temp' ? .5 :1",
                  "c == 'temp' ? .5 : 1"
              )

              text = text.replace(
                  "Border.all((x['c'] as Color).withOpacity(.25))",
                  "Border.all(color: (x['c'] as Color).withOpacity(.25))"
              )

              p.write_text(
                  text,
                  encoding="utf-8"
              )

          print("Dart repair complete.")

          PY


      # =========================================================
      # 8. ANDROID TOOLCHAIN
      # =========================================================

      - name: Stabilize Android Toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          # Gradle 8.14.5
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i -E \
              's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.5-\1.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

          fi


          # AGP
          if [ -f android/settings.gradle ]; then

            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g' \
              android/settings.gradle || true

            sed -i -E \
              's/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle || true

            sed -i -E \
              's/(id[[:space:]]+["'\'']com\.android\.application["'\''][[:space:]]+version[[:space:]]+["'\''])[^"'\'']+(["'\''])/\18.11.1\2/g' \
              android/settings.gradle || true

            sed -i -E \
              's/(id[[:space:]]+["'\'']org\.jetbrains\.kotlin\.android["'\''][[:space:]]+version[[:space:]]+["'\''])[^"'\'']+(["'\''])/\12.2.20\2/g' \
              android/settings.gradle || true

          fi


          if [ -f android/settings.gradle.kts ]; then

            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g' \
              android/settings.gradle.kts || true

            sed -i -E \
              's/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle.kts || true

          fi


      # =========================================================
      # 9. ANDROIDX
      # =========================================================

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -e

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          grep -q "^android.useAndroidX=true" \
            android/gradle.properties \
            || echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=true" \
            android/gradle.properties \
            || echo "android.enableJetifier=true" >> android/gradle.properties

          grep -q "^org.gradle.jvmargs=" \
            android/gradle.properties \
            || echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> android/gradle.properties


      # =========================================================
      # 10. FIX URI IMPORT
      # =========================================================

      - name: Fix Android Uri Import
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -e

          MAIN="$(
            find android/app/src/main \
              -type f \
              \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
              -print \
              | head -n 1
          )"

          if [ -n "$MAIN" ]; then

            if grep -q "Uri" "$MAIN"; then

              if [[ "$MAIN" == *.kt ]]; then

                grep -q "import android.net.Uri" "$MAIN" \
                  || sed -i '1i import android.net.Uri' "$MAIN"

              elif [[ "$MAIN" == *.java ]]; then

                grep -q "import android.net.Uri;" "$MAIN" \
                  || sed -i '/^package /a import android.net.Uri;' "$MAIN"

              fi

            fi

          fi


      # =========================================================
      # 11. REPAIR LOGO
      # =========================================================

      - name: Repair Logo PNG
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            pillow

          python3 <<'PY'

          from pathlib import Path
          from PIL import Image

          root = Path(
              "android/app/src/main/res"
          )

          for p in root.rglob("*.png"):

              try:

                  img = Image.open(p)
                  img.load()

                  if img.format != "PNG":
                      continue

                  print(
                      "PNG OK:",
                      p,
                      img.size
                  )

              except Exception as e:

                  print(
                      "Skipping:",
                      p,
                      e
                  )

          PY


      # =========================================================
      # 12. DART FORMAT
      # =========================================================

      - name: Dart Format
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          dart format lib


      # =========================================================
      # 13. ANALYZE
      # =========================================================

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # =========================================================
      # 14. BUILD USER APK
      # =========================================================

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart \
            --android-skip-build-dependency-validation


      # =========================================================
      # 15. BUILD ADMIN APK
      # =========================================================

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart \
            --android-skip-build-dependency-validation


      # =========================================================
      # 16. COLLECT APK
      # =========================================================

      - name: Prepare APK Files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p release

          USER_APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name "*user*release*.apk" \
              | head -n 1
          )"

          ADMIN_APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name "*admin*release*.apk" \
              | head -n 1
          )"

          if [ -z "$USER_APK" ]; then

            echo "::error::User APK not found."

            find build/app/outputs \
              -type f \
              -name "*.apk"

            exit 1

          fi

          if [ -z "$ADMIN_APK" ]; then

            echo "::error::Admin APK not found."

            find build/app/outputs \
              -type f \
              -name "*.apk"

            exit 1

          fi

          cp "$USER_APK" \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp "$ADMIN_APK" \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          ls -lh release


      # =========================================================
      # 17. UPLOAD APK ARTIFACT
      # =========================================================

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-V6-APKS
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. FIND ADMIN DASHBOARD
      # =========================================================

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          set -e

          ADMIN=""

          # Preferred location
          if [ -f "$PROJECT_DIR/admin-dashboard/index.html" ]; then

            ADMIN="$PROJECT_DIR/admin-dashboard"

          fi


          # Search if not found
          if [ -z "$ADMIN" ]; then

            INDEX="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "index.html" \
                ! -path "*/node_modules/*" \
                ! -path "*/build/*" \
                -print \
                | head -n 1
            )"

            if [ -n "$INDEX" ]; then
              ADMIN="$(dirname "$INDEX")"
            fi

          fi


          if [ -z "$ADMIN" ]; then

            echo "Admin dashboard not found."
            echo "admin_found=false" >> "$GITHUB_OUTPUT"

          else

            echo "ADMIN:"
            echo "$ADMIN"

            echo "admin_found=true" >> "$GITHUB_OUTPUT"
            echo "admin_dir=$ADMIN" >> "$GITHUB_OUTPUT"

          fi


      # =========================================================
      # 19. PREPARE GITHUB PAGES
      # =========================================================

      - name: Prepare Admin Pages
        if: steps.admin.outputs.admin_found == 'true'
        shell: bash
        run: |

          set -e

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin_dir }}/." \
            public/

          touch public/.nojekyll

          echo "=========================================="
          echo "ADMIN DASHBOARD FILES"
          echo "=========================================="

          find public \
            -maxdepth 5 \
            -type f \
            | sort


      # =========================================================
      # 20. DEPLOY ADMIN
      # =========================================================

      - name: Deploy Admin Dashboard
        if: steps.admin.outputs.admin_found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy SADEE X DIMA V6 Admin Dashboard"


      # =========================================================
      # 21. BUILD LOG
      # =========================================================

      - name: Upload Flutter Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-V6-BUILD-LOGS
          path: |
            ${{ env.PROJECT_DIR }}/build
            ${{ env.PROJECT_DIR }}/.dart_tool
          if-no-files-found: ignore
          retention-days: 7


      # =========================================================
      # 22. COMPLETE
      # =========================================================

      - name: Build Complete
        if: success()
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "       SADEE X DIMA V6 SUCCESS"
          echo "=========================================="
          echo ""
          echo "USER APK:"
          echo "SADEE-DIMA-OPTIMIZER-USER.apk"
          echo ""
          echo "ADMIN APK:"
          echo "SADEE-DIMA-OPTIMIZER-ADMIN.apk"
          echo ""
          echo "Admin Dashboard:"
          echo "gh-pages branch"
          echo ""
          echo "BUILD COMPLETE"
          echo "=========================================="
