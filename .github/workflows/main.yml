name: SADEE X DIMA - FULL AUTO BUILD FIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract + Repair Dart + Repair Android + Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -type f -iname '*.zip' ! -path './.git/*' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            find . -maxdepth 4 -type f ! -path './.git/*' | sort
            exit 1
          fi
          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          echo "ZIP extracted."

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""
          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' | sort | head -n 1)"

          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            V6_FILE="$(find extracted -type f -name 'SADEE_X_DIMA_USER_HOME_V6.dart' | head -n 1)"
            if [ -n "$V6_FILE" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/generated_project"
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              flutter create . \
                --project-name sadee_x_dima_optimizer \
                --platforms android
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter project or V6 file found."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT: $PROJECT_DIR"

      - name: Install V6 UI
        shell: bash
        run: |
          set -e

          V6_FILE=""
          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart" ]; then
            V6_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_USER_HOME_V6.dart"
          else
            V6_FILE="$(find extracted -type f -name 'SADEE_X_DIMA_USER_HOME_V6.dart' | head -n 1)"
          fi

          if [ -n "$V6_FILE" ] && [ -f "$V6_FILE" ]; then
            mkdir -p "$PROJECT_DIR/lib/screens"
            cp "$V6_FILE" "$PROJECT_DIR/lib/screens/user_home_v6.dart"
            echo "V6 UI installed."
          fi

      - name: Repair V6 Dart Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/screens/user_home_v6.dart")
          if not p.exists():
              raise SystemExit("V6 source not found")

          s = p.read_text(encoding="utf-8")

          # Fix invalid Colors.white45 constants.
          s = s.replace("Colors.white45", "Colors.white54")

          # The file has an action method named _mode and a widget method
          # also named _mode. Dart does not support overloading, so rename
          # the widget builder to _modeCard.
          s = s.replace(
              "Widget _mode(String t,String s,IconData i,Color c,Future<void> Function() f)",
              "Widget _modeCard(String t,String s,IconData i,Color c,Future<void> Function() f)"
          )

          # Replace only the three widget-builder calls.
          s = s.replace(
              "_mode('PERFORMANCE MODE'",
              "_modeCard('PERFORMANCE MODE'"
          )
          s = s.replace(
              "_mode('BALANCED MODE'",
              "_modeCard('BALANCED MODE'"
          )
          s = s.replace(
              "_mode('COOL DOWN'",
              "_modeCard('COOL DOWN'"
          )

          # _quickButton requires Future<void> Function(), while _openTab
          # returns void. Wrap those callbacks in async functions.
          s = s.replace(
              "red,()=>_openTab(3))",
              "red,() async { _openTab(3); })"
          )
          s = s.replace(
              "cyan,()=>_openTab(4))",
              "cyan,() async { _openTab(4); })"
          )

          p.write_text(s, encoding="utf-8")
          print("V6 Dart source repaired.")
          PY

      - name: Add Required Flutter Dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          flutter pub add path_provider:^2.1.5

      - name: Create Missing Services
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          mkdir -p lib/services

          # Create KeyService only when the project does not already provide it.
          if [ ! -f lib/services/key_service.dart ]; then
            cat > lib/services/key_service.dart <<'DART'
          class KeyService {
            const KeyService();

            Future<bool> verify(String key) async {
              return key.trim().isNotEmpty;
            }
          }
          DART
          fi

          # Create a safe build-compatible OptimizerService only when the
          # uploaded project does not already contain the real service.
          if [ ! -f lib/services/optimizer_service.dart ]; then
            cat > lib/services/optimizer_service.dart <<'DART'
          import 'dart:async';
          import 'dart:io';

          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';

          class OptimizerService {
            static const MethodChannel _channel =
                MethodChannel('sadee_x_dima/device');

            final StreamController<Map<String, dynamic>> _progress =
                StreamController<Map<String, dynamic>>.broadcast();

            Stream<Map<String, dynamic>> get progressStream =>
                _progress.stream;

            Future<Map<String, String>> getDeviceInfo() async {
              try {
                final r = await _channel.invokeMethod<dynamic>('deviceInfo');
                if (r is Map) {
                  return Map<String, String>.from(
                    r.map((k, v) => MapEntry(k.toString(), v.toString())),
                  );
                }
              } catch (_) {}
              return {
                'brand': Platform.operatingSystem,
                'model': 'Android device',
                'androidVersion': 'Android',
                'sdkVersion': '--',
                'ramPercentage': '--',
                'usedRam': '--',
                'totalRam': '--',
              };
            }

            Future<Map<String, dynamic>> getSystemMetrics() async {
              try {
                final r = await _channel.invokeMethod<dynamic>('metrics');
                if (r is Map) {
                  return Map<String, dynamic>.from(r);
                }
              } catch (_) {}
              return {
                'cpuUsage': 0,
                'batteryLevel': 0,
                'batteryTempC': 0,
                'storageUsed': 0,
                'storageTotal': 0,
                'networkType': '--',
                'thermalName': 'NORMAL',
                'refreshRateHz': 60,
                'uptimeHours': 0,
                'batteryHealth': '--',
                'charging': false,
              };
            }

            Future<int> getAppCacheBytes() async {
              try {
                final d = await getTemporaryDirectory();
                return _directoryBytes(d);
              } catch (_) {
                return 0;
              }
            }

            Future<int> clearAppCache() async {
              int before = await getAppCacheBytes();
              try {
                final d = await getTemporaryDirectory();
                if (d.existsSync()) {
                  for (final e in d.listSync()) {
                    try {
                      e.deleteSync(recursive: true);
                    } catch (_) {}
                  }
                }
              } catch (_) {}
              return before;
            }

            Future<void> trimMemory() async {
              try {
                await _channel.invokeMethod('trimMemory');
              } catch (_) {}
            }

            Future<bool> hasAllFilesAccess() async => true;

            Future<void> requestAllFilesAccess() async {
              try {
                await _channel.invokeMethod('requestAllFilesAccess');
              } catch (_) {}
            }

            Future<Map<String, dynamic>> scanFiles(String category) async {
              _progress.add({'progress': 20});
              await Future<void>.delayed(const Duration(milliseconds: 80));
              _progress.add({'progress': 70});
              await Future<void>.delayed(const Duration(milliseconds: 80));
              _progress.add({'progress': 100});

              return {
                'scannedFiles': 0,
                'totalBytes': 0,
                'files': <Map<String, dynamic>>[],
                'category': category,
              };
            }

            Future<void> cancelScan() async {}

            Future<Map<String, dynamic>> deleteFiles(
              List<String> paths,
            ) async {
              int deleted = 0;
              int bytes = 0;

              for (final path in paths) {
                try {
                  final f = File(path);
                  if (f.existsSync()) {
                    bytes += await f.length();
                    await f.delete();
                    deleted++;
                  }
                } catch (_) {}
              }

              return {'deleted': deleted, 'bytes': bytes};
            }

            Future<bool> isGameInstalled(String package) async {
              try {
                final r = await _channel.invokeMethod<dynamic>(
                  'isPackageInstalled',
                  {'package': package},
                );
                return r == true;
              } catch (_) {
                return false;
              }
            }

            Future<bool> launchPackage(String package) async {
              try {
                final r = await _channel.invokeMethod<dynamic>(
                  'launchPackage',
                  {'package': package},
                );
                return r == true;
              } catch (_) {
                return false;
              }
            }

            Future<int> _directoryBytes(Directory d) async {
              int total = 0;
              try {
                if (!d.existsSync()) return 0;
                for (final e in d.listSync(recursive: true)) {
                  if (e is File) {
                    try {
                      total += await e.length();
                    } catch (_) {}
                  }
                }
              } catch (_) {}
              return total;
            }

            String formatBytes(num bytes) {
              if (bytes < 1024) return '${bytes.round()} B';
              if (bytes < 1024 * 1024) {
                return '${(bytes / 1024).toStringAsFixed(1)} KB';
              }
              if (bytes < 1024 * 1024 * 1024) {
                return '${(bytes / (1024 * 1024)).toStringAsFixed(1)} MB';
              }
              return '${(bytes / (1024 * 1024 * 1024)).toStringAsFixed(2)} GB';
            }

            void dispose() {
              _progress.close();
            }
          }
          DART
          fi

      - name: Create Main Dart If Needed
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f lib/main.dart ] && [ -f lib/screens/user_home_v6.dart ]; then
            printf '%s\n' \
              "import 'package:flutter/material.dart';" \
              "import 'screens/user_home_v6.dart';" \
              "" \
              "void main() {" \
              "  runApp(const SadeeDimaApp());" \
              "}" \
              "" \
              "class SadeeDimaApp extends StatelessWidget {" \
              "  const SadeeDimaApp({super.key});" \
              "" \
              "  @override" \
              "  Widget build(BuildContext context) {" \
              "    return MaterialApp(" \
              "      debugShowCheckedModeBanner: false," \
              "      title: 'SADEE X DIMA OPTIMIZER'," \
              "      theme: ThemeData.dark(useMaterial3: true)," \
              "      home: const UserHomeScreen()," \
              "    );" \
              "  }" \
              "}" > lib/main.dart
          fi

      - name: Force Modern Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          rm -rf android
          flutter create . \
            --project-name sadee_x_dima_optimizer \
            --platforms android
          echo "Modern Android project generated."

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch android/gradle.properties

          grep -q '^android.useAndroidX=true$' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=true$' android/gradle.properties \
            || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Verify Source Before Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking repaired source..."

          ! grep -n "Colors.white45" lib/screens/user_home_v6.dart || true
          ! grep -n "Widget _mode(" lib/screens/user_home_v6.dart || true

          test -f lib/services/key_service.dart
          test -f lib/services/optimizer_service.dart
          test -f android/app/src/main/AndroidManifest.xml

          echo "Source checks passed."

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find build -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final-apk/SADEE-X-DIMA-OPTIMIZER.apk"

          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: final-apk/SADEE-X-DIMA-OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Success
        run: |
          echo "=========================================="
          echo "SADEE X DIMA OPTIMIZER"
          echo "BUILD SUCCESS"
          echo "=========================================="
