name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. FIND ZIP
      # =========================================================
      - name: Find Uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "Searching repository for ZIP..."

          ZIP_FILE="$(find . \
            -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Upload your SADEE X DIMA ZIP to the repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 3. EXTRACT ZIP
      # =========================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED PROJECT"
          echo "========================================"

          find extracted -maxdepth 5 -type f | head -400

      # =========================================================
      # 4. FIND ANDROID PROJECT
      # =========================================================
      - name: Locate Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          SETTINGS_FILE="$(
            find extracted \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 5. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 6. GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =========================================================
      # 7. ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX configured."

      # =========================================================
      # 8. FORCE GRADLE WRAPPER 8.7
      # =========================================================
      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          WRAPPER="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then

            echo "Old Gradle wrapper:"
            cat "$WRAPPER"

            sed -i -E \
              's#gradle-[0-9]+(\.[0-9]+)*-(bin|all)\.zip#gradle-8.7-\3.zip#g' \
              "$WRAPPER"

            # Fallback if the first replacement did not match
            sed -i -E \
              's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.7-\1.zip#g' \
              "$WRAPPER"

            echo ""
            echo "New Gradle wrapper:"
            cat "$WRAPPER"

          fi

      # =========================================================
      # 9. GRADLE WRAPPER PERMISSION
      # =========================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
          fi

      # =========================================================
      # 10. ANDROID RESOURCE FIXES
      # =========================================================
      - name: Fix Android Resources
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          RES="$PROJECT/app/src/main/res"

          if [ ! -d "$RES" ]; then
            echo "ERROR: Android res directory not found."
            exit 1
          fi

          echo "Fixing XML compatibility..."

          # hintTextColor -> textColorHint
          find "$RES" \
            -type f \
            -name '*.xml' \
            -exec sed -i \
            's/android:hintTextColor=/android:textColorHint=/g' {} \;

          # Move color selector from values to color
          if [ -f "$RES/values/nav_colors.xml" ]; then

            mkdir -p "$RES/color"

            mv \
              "$RES/values/nav_colors.xml" \
              "$RES/color/nav_colors.xml"

            echo "nav_colors.xml moved."

          fi

          echo "Resource fixes complete."

      # =========================================================
      # 11. JAVA SOURCE FIXES
      # =========================================================
      - name: Fix Java Source
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"
          JAVA_DIR="$PROJECT/app/src/main/java"

          if [ ! -d "$JAVA_DIR" ]; then
            echo "No Java directory found."
            exit 0
          fi

          echo "Searching Java source..."

          # Bundle import
          while IFS= read -r FILE; do

            if grep -q "class Page5InjectorFragment" "$FILE"; then

              if ! grep -q "import android.os.Bundle;" "$FILE"; then

                sed -i \
                  '/^package /a import android.os.Bundle;' \
                  "$FILE"

              fi

            fi

          done < <(
            find "$JAVA_DIR" \
              -type f \
              -name '*.java'
          )

          # javax.xml.bind -> java.time
          while IFS= read -r FILE; do

            if grep -q "javax.xml.bind.DatatypeConverter" "$FILE"; then

              python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = (
              r'javax\.xml\.bind\.DatatypeConverter'
              r'\.parseDateTime\(([^)]*)\)'
              r'\.getTimeInMillis\(\)'
          )

          def replace(match):
              value = match.group(1)

              return (
                  "java.time.OffsetDateTime.parse("
                  + value +
                  ").toInstant().toEpochMilli()"
              )

          text = re.sub(pattern, replace, text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

            fi

          done < <(
            find "$JAVA_DIR" \
              -type f \
              -name '*.java'
          )

          echo "Java fixes complete."

      # =========================================================
      # 12. CHECK SUPABASE CONFIG
      # =========================================================
      - name: Check Supabase Configuration
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          echo "Searching Supabase configuration..."

          grep -Rni \
            --include='*.java' \
            --include='*.kt' \
            "supabase.co" \
            "$PROJECT/app/src/main" \
            || true

          echo ""
          echo "NOTE:"
          echo "Do NOT put a Supabase service-role/secret key in the APK."

      # =========================================================
      # 13. PROJECT INFO
      # =========================================================
      - name: Show Project Configuration
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          echo "$PROJECT"

          echo ""
          echo "========================================"
          echo "SETTINGS.GRADLE"
          echo "========================================"

          cat "$PROJECT/settings.gradle" 2>/dev/null || \
          cat "$PROJECT/settings.gradle.kts" 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "APP BUILD.GRADLE"
          echo "========================================"

          cat "$PROJECT/app/build.gradle" 2>/dev/null || \
          cat "$PROJECT/app/build.gradle.kts" 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          gradle --version

      # =========================================================
      # 14. CLEAN
      # =========================================================
      - name: Clean Android Project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cd "$PROJECT"

          gradle clean --stacktrace

      # =========================================================
      # 15. BUILD APK
      # =========================================================
      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cd "$PROJECT"

          echo "========================================"
          echo "SADEE X DIMA APK BUILD"
          echo "========================================"

          gradle assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "BUILD STATUS: $BUILD_STATUS"

          exit "$BUILD_STATUS"

      # =========================================================
      # 16. FIND APK
      # =========================================================
      - name: Find Generated APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          APK="$(
            find "$PROJECT/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 17. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-LOGIN-FIXED-V3-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 18. UPLOAD BUILD LOG
      # =========================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 19. FIND ADMIN DASHBOARD
      # =========================================================
      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN_DIR=""

          # First preference
          if [ -d "extracted/admin-dashboard" ]; then
            ADMIN_DIR="extracted/admin-dashboard"
          fi

          # Search index.html
          if [ -z "$ADMIN_DIR" ]; then

            INDEX_FILE="$(
              find extracted \
                -type f \
                -name 'index.html' \
                | head -n 1
            )"

            if [ -n "$INDEX_FILE" ]; then
              ADMIN_DIR="$(dirname "$INDEX_FILE")"
            fi

          fi

          if [ -z "$ADMIN_DIR" ]; then

            echo "Admin dashboard not found."

            echo "found=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "ADMIN:"
          echo "$ADMIN_DIR"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$ADMIN_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 20. PREPARE ADMIN
      # =========================================================
      - name: Prepare Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.path }}/." \
            public/

          echo "========================================"
          echo "ADMIN DASHBOARD FILES"
          echo "========================================"

          find public \
            -maxdepth 4 \
            -type f \
            | sort

      # =========================================================
      # 21. DEPLOY ADMIN
      # =========================================================
      - name: Deploy Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy SADEE X DIMA Admin Dashboard"

      # =========================================================
      # 22. FINAL
      # =========================================================
      - name: Build Complete
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "SADEE X DIMA BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "APK artifact:"
          echo "SADEE-X-DIMA-LOGIN-FIXED-V3-APK"
          echo ""
          echo "Admin dashboard:"
          echo "Deployed to gh-pages"
          echo ""
          echo "BUILD COMPLETE"
