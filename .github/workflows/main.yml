name: SADEE X DIMA - BUILD APK AND ADMIN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima
  cancel-in-progress: true

jobs:

  # ==========================================================
  # BUILD APK
  # ==========================================================
  build-apk:

    name: Build APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # FIND ZIP
      # -----------------------------
      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found in repository root."
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # EXTRACT
      # -----------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

          echo "ZIP EXTRACTED"

      # -----------------------------
      # FIND ANDROID PROJECT
      # -----------------------------
      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 10 -type f | sort
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # JAVA 17
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # GRADLE 8
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      # -----------------------------
      # ANDROIDX
      # -----------------------------
      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          touch gradle.properties

          grep -v "^android.useAndroidX=" gradle.properties > /tmp/gp || true
          mv /tmp/gp gradle.properties 2>/dev/null || true

          grep -v "^android.enableJetifier=" gradle.properties > /tmp/gp2 || true
          mv /tmp/gp2 gradle.properties 2>/dev/null || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "ANDROIDX ENABLED"

      # -----------------------------
      # REPOSITORY FIX
      # -----------------------------
      - name: Fix Gradle Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          if [ -f settings.gradle.kts ]; then

            sed -i \
              's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

            sed -i \
              's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle.kts || true

          fi

      # -----------------------------
      # FIX COLOR SELECTOR LOCATION
      # -----------------------------
      - name: Fix Color Resources
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          mkdir -p app/src/main/res/color

          if [ -f app/src/main/res/values/nav_colors.xml ]; then

            if grep -q "state_checked" \
              app/src/main/res/values/nav_colors.xml; then

              mv \
                app/src/main/res/values/nav_colors.xml \
                app/src/main/res/color/nav_colors.xml

            fi

          fi

      # -----------------------------
      # SHOW JAVA SOURCE ON ERROR
      # -----------------------------
      - name: Inspect Java Sources
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          echo "JAVA FILES:"
          find app/src/main/java \
            -type f \
            -name "*.java" \
            | sort

          FILE=$(find app/src/main/java \
            -type f \
            -name "Page5InjectorFragment.java" \
            | head -n 1)

          if [ -n "$FILE" ]; then

            echo ""
            echo "================================"
            echo "Page5InjectorFragment.java"
            echo "================================"

            nl -ba "$FILE" | sed -n '1,160p'

          fi

      # -----------------------------
      # CLEAN
      # -----------------------------
      - name: Clean
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          gradle clean --no-daemon

      # -----------------------------
      # BUILD
      # -----------------------------
      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set +e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "================================"
          echo "JAVA ERROR"
          echo "================================"

          grep -n -A15 -B5 \
            -E "cannot find symbol|symbol:|location:|error:" \
            build.log \
            | tail -250 || true

          echo ""
          echo "BUILD EXIT CODE: $RESULT"

          exit $RESULT

      # -----------------------------
      # APK ARTIFACT
      # -----------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # -----------------------------
      # BUILD LOG
      # -----------------------------
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore


  # ==========================================================
  # ADMIN DASHBOARD
  # ==========================================================
  admin:

    name: Admin

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # FIND ZIP
      # -----------------------------
      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # EXTRACT
      # -----------------------------
      - name: Extract ZIP
        shell: bash
        run: |

          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

      # -----------------------------
      # FIND ADMIN
      # -----------------------------
      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: admin-dashboard / index.html not found."
              find extracted -maxdepth 10 -type f | sort
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # PREPARE WEBSITE
      # -----------------------------
      - name: Prepare Admin
        shell: bash
        run: |

          set -e

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo "ADMIN READY"

          find public -maxdepth 5 -type f | sort

      # -----------------------------
      # DEPLOY
      # -----------------------------
      - name: Deploy Admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
