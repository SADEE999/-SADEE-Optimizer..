name: SADEE X DIMA REAL BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found in repository root."
            ls -la
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 6 -type f | sort

      - name: Find Android Project
        id: android
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          touch gradle.properties

          sed -i '/android.useAndroidX/d' gradle.properties || true
          sed -i '/android.enableJetifier/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix Repository Mode
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          if [ -f settings.gradle ]; then
            sed -i \
              's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true
          fi

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        run: |
          set -e

          APK=$(find \
            "${{ steps.android.outputs.project }}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Find Admin Dashboard
        id: admin
        run: |
          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" | head -n 1)

          if [ -z "$ADMIN" ]; then
            INDEX=$(find extracted \
              -type f \
              -name "index.html" | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: Admin dashboard not found."
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo "Admin: $ADMIN"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Admin
        run: |
          set -e

          rm -rf public
          mkdir public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

      - name: Deploy Admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false

      - name: Create Final Package
        run: |
          set -e

          rm -rf final
          mkdir -p final/ADMIN_DASHBOARD

          cp \
            "${{ steps.apk.outputs.apk }}" \
            final/SADEE_X_DIMA.apk

          cp -R \
            public/. \
            final/ADMIN_DASHBOARD/

          echo "SADEE X DIMA REAL RELEASE" > final/README.txt
          echo "" >> final/README.txt
          echo "SADEE_X_DIMA.apk = Android application" >> final/README.txt
          echo "ADMIN_DASHBOARD = Web admin dashboard" >> final/README.txt

          cd final

          zip -r ../SADEE_X_DIMA_REAL_RELEASE.zip .

          cd ..

          echo "================================"
          echo "FINAL ZIP"
          echo "================================"

          ls -lh SADEE_X_DIMA_REAL_RELEASE.zip

          echo ""
          echo "CONTENTS:"
          unzip -l SADEE_X_DIMA_REAL_RELEASE.zip

      - name: Upload Final Release
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-RELEASE
          path: SADEE_X_DIMA_REAL_RELEASE.zip
          if-no-files-found: error
          retention-days: 30
