name: SADEE X DIMA V7 - REAL OPTIMIZER + SIGNED APK + ADMIN

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find newest SADEE project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -type f -iname '*.zip' ! -path './.git/*' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          ZIP=""
          for candidate in "${ZIPS[@]}"; do
            if [[ "$candidate" =~ SADEE.*(OPTIMIZER|DASHBOARD|NEON|REAL|FULL|V[0-9]) ]]; then
              ZIP="$candidate"
              break
            fi
          done
          if [ -z "$ZIP" ] && [ "${#ZIPS[@]}" -gt 0 ]; then ZIP="${ZIPS[0]}"; fi
          if [ -z "$ZIP" ]; then
            echo 'ERROR: No project ZIP found in repository.' >&2
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Using newest ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted
          PROJECT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT" ]; then
            echo 'ERROR: Android Gradle project not found after extraction.' >&2
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare and validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' > gradle.properties
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sadee/optimizer/MainActivity.java
          test -f app/src/main/java/com/sadee/optimizer/DeviceInfo.java
          test -f app/src/main/java/com/sadee/optimizer/Supabase.java
          test -f app/src/main/res/drawable/sadee_logo.jpg
          grep -q 'dashboardPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableBoostPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableCleanPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'stableGamingPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'optimizedPage' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'remaining(exp)' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'runOptimization' app/src/main/java/com/sadee/optimizer/MainActivity.java
          grep -q 'NEON INJECTOR' app/src/main/java/com/sadee/optimizer/MainActivity.java
          echo 'Source validation passed.'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p signed

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > signed/release.jks
          else
            echo 'No Android signing secrets configured; generating a temporary release key for this build.'
            keytool -genkeypair -v -keystore signed/release.jks \
              -storepass changeit -keypass changeit -alias sadee \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Colombo, ST=Western, C=LK' >/dev/null 2>&1
            KEYSTORE_PASSWORD=changeit
            KEY_ALIAS=sadee
            KEY_PASSWORD=changeit
          fi

          "$ZIPALIGN" -f 4 "$APK" signed/aligned.apk
          "$APKSIGNER" sign \
            --ks signed/release.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out signed/SADEE-X-DIMA-REAL-OPTIMIZER-V7.apk \
            signed/aligned.apk
          "$APKSIGNER" verify --verbose signed/SADEE-X-DIMA-REAL-OPTIMIZER-V7.apk
          echo 'Signed APK verified.'

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-OPTIMIZER-V7-SIGNED-APK
          path: signed/SADEE-X-DIMA-REAL-OPTIMIZER-V7.apk
          if-no-files-found: error

      - name: Upload build logs and outputs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V7-BUILD-OUTPUTS
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
            signed/**
          if-no-files-found: warn

      - name: Prepare admin dashboard
        shell: bash
        run: |
          set -euo pipefail
          ADMIN="$(find extracted -type f -path '*/admin-dashboard/index.html' -print -quit | xargs -r dirname)"
          if [ -z "$ADMIN" ]; then
            echo 'Admin dashboard not found; APK build will still succeed.'
            exit 0
          fi
          rm -rf public
          mkdir -p public
          cp -R "$ADMIN"/* public/
          touch public/.nojekyll

      - name: Deploy admin dashboard to gh-pages
        if: ${{ success() && hashFiles('public/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
