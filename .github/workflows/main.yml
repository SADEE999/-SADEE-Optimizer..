name: SADEE X DIMA REAL BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-real-build
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: Put the generated SADEE_X_DIMA_FULL.zip in the repository root.'
            ls -la
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e
          PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo 'ERROR: Android project not found in ZIP.'
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Repair Android Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

          # Fix old repository-mode settings when present.
          for f in settings.gradle settings.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' "$f" || true
              sed -i 's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' "$f" || true
            fi
          done

          # A selector belongs in res/color, not res/values.
          if [ -f app/src/main/res/values/nav_colors.xml ] && grep -q 'state_checked' app/src/main/res/values/nav_colors.xml; then
            mkdir -p app/src/main/res/color
            mv app/src/main/res/values/nav_colors.xml app/src/main/res/color/nav_colors.xml
          fi

          # Repair common Java 17 JAXB usage from older source.
          if [ -f app/src/main/java/com/sadee/optimizer/Supabase.java ]; then
            sed -i 's/javax\.xml\.bind\.DatatypeConverter\.parseDateTime(s)\.getTimeInMillis()/java.time.Instant.parse(s).toEpochMilli()/g' app/src/main/java/com/sadee/optimizer/Supabase.java || true
          fi

          # Context#getCodeCache() is unnecessary for the safe cleaner; use cache only.
          if [ -f app/src/main/java/com/sadee/optimizer/MainActivity.java ]; then
            sed -i 's/clearCache(getCacheDir());[[:space:]]*clearCache(getCodeCache());/clearCache(getCacheDir());/g' app/src/main/java/com/sadee/optimizer/MainActivity.java || true
          fi

          # Fix missing Bundle imports in Fragment files.
          find app/src/main/java -type f -name '*.java' -print0 | while IFS= read -r -d '' f; do
            if grep -q 'Bundle' "$f" && ! grep -q '^import android.os.Bundle;' "$f" && grep -q '^package ' "$f"; then
              sed -i '/^package .*;/a import android.os.Bundle;' "$f"
            fi
          done

          # XML ampersand repair for old layouts.
          find app/src/main/res -type f -name '*.xml' -print0 | while IFS= read -r -d '' f; do
            sed -i 's/ & / &amp; /g' "$f" || true
          done

      - name: Clean Project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: gradle clean --no-daemon

      - name: Build APK
        id: build
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" != '0' ]; then
            echo '===== COMPILER ERRORS ====='
            grep -n -A18 -B8 'cannot find symbol\|package javax.xml.bind\|error:' build.log | tail -300 || true
            exit "$RESULT"
          fi
          echo 'APK BUILD SUCCESS'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-BUILD-LOG
          path: ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e
          ADMIN=$(find extracted -type d -name admin-dashboard | head -n 1)
          if [ -z "$ADMIN" ]; then
            INDEX=$(find extracted -type f -name index.html | head -n 1)
            [ -n "$INDEX" ] || { echo 'ERROR: admin-dashboard/index.html not found.'; exit 1; }
            ADMIN=$(dirname "$INDEX")
          fi
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"
          echo "Admin: $ADMIN"

      - name: Prepare Admin Dashboard
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public
          cp -R "${{ steps.admin.outputs.admin }}/." public/
          touch public/.nojekyll

      - name: Deploy Admin to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
