name: SADEE X DIMA V5 BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima-v5
  cancel-in-progress: true

jobs:
  build-apk-and-admin:
    name: Build APK and Admin
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. FIND ZIP UPLOADED TO GITHUB
      # =========================================================
      - name: Find Project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE="$(find . \
            -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 3. EXTRACT ZIP
      # =========================================================
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "===== EXTRACTED FILES ====="

          find extracted \
            -maxdepth 6 \
            -type f \
            | head -500

      # =========================================================
      # 4. FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android Project
        id: android
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS_FILE="$(
            find extracted \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app directory not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 5. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 6. GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =========================================================
      # 7. ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX configured."

      # =========================================================
      # 8. FORCE GRADLE WRAPPER 8.7
      # =========================================================
      - name: Force Gradle Wrapper 8.7
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"
          WRAPPER="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then

            echo "Before:"
            cat "$WRAPPER"

            python3 - "$WRAPPER" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'gradle-[0-9.]+-(bin|all)\.zip',
              r'gradle-8.7-\1.zip',
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

            echo ""
            echo "After:"
            cat "$WRAPPER"

          fi

      # =========================================================
      # 9. GRADLE WRAPPER PERMISSION
      # =========================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
          fi

      # =========================================================
      # 10. FIX ANDROID XML
      # =========================================================
      - name: Fix Android XML Resources
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"
          RES="$PROJECT/app/src/main/res"

          if [ ! -d "$RES" ]; then
            echo "::error::res directory not found."
            exit 1
          fi

          echo "Fixing hintTextColor..."

          find "$RES" \
            -type f \
            -name '*.xml' \
            -exec sed -i \
            's/android:hintTextColor=/android:textColorHint=/g' {} \;

          echo "Checking nav_colors.xml..."

          if [ -f "$RES/values/nav_colors.xml" ]; then

            mkdir -p "$RES/color"

            mv \
              "$RES/values/nav_colors.xml" \
              "$RES/color/nav_colors.xml"

            echo "nav_colors.xml moved to res/color."

          fi

      # =========================================================
      # 11. FIX JAVA SOURCE
      # =========================================================
      - name: Fix Java Source Compatibility
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"
          JAVA_DIR="$PROJECT/app/src/main/java"

          if [ ! -d "$JAVA_DIR" ]; then
            echo "No Java directory."
            exit 0
          fi

          # -----------------------------------------------------
          # Bundle import
          # -----------------------------------------------------
          while IFS= read -r FILE; do

            if grep -q "class Page5InjectorFragment" "$FILE"; then

              if ! grep -q "import android.os.Bundle;" "$FILE"; then

                sed -i \
                  '/^package /a import android.os.Bundle;' \
                  "$FILE"

              fi

            fi

          done < <(
            find "$JAVA_DIR" \
              -type f \
              -name '*.java'
          )

          # -----------------------------------------------------
          # javax.xml.bind compatibility
          # -----------------------------------------------------
          while IFS= read -r FILE; do

            if grep -q "javax.xml.bind.DatatypeConverter" "$FILE"; then

              python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = (
              r'javax\.xml\.bind\.DatatypeConverter'
              r'\.parseDateTime\(([^)]*)\)'
              r'\.getTimeInMillis\(\)'
          )

          def replacement(match):
              value = match.group(1)

              return (
                  "java.time.OffsetDateTime.parse("
                  + value +
                  ").toInstant().toEpochMilli()"
              )

          text = re.sub(
              pattern,
              replacement,
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

            fi

          done < <(
            find "$JAVA_DIR" \
              -type f \
              -name '*.java'
          )

      # =========================================================
      # 12. VERIFY CONFIG
      # =========================================================
      - name: Verify Project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          echo "$PROJECT"

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          gradle --version

          echo ""
          echo "========================================"
          echo "APP BUILD FILE"
          echo "========================================"

          if [ -f "$PROJECT/app/build.gradle" ]; then
            cat "$PROJECT/app/build.gradle"
          elif [ -f "$PROJECT/app/build.gradle.kts" ]; then
            cat "$PROJECT/app/build.gradle.kts"
          fi

      # =========================================================
      # 13. CLEAN
      # =========================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cd "$PROJECT"

          gradle clean --stacktrace

      # =========================================================
      # 14. BUILD APK
      # =========================================================
      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          cd "$PROJECT"

          echo "========================================"
          echo "SADEE X DIMA V5 BUILD"
          echo "========================================"

          gradle assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "BUILD EXIT CODE: $STATUS"

          exit "$STATUS"

      # =========================================================
      # 15. FIND APK
      # =========================================================
      - name: Find APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android.outputs.project_dir }}"

          APK="$(
            find "$PROJECT/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 16. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V5-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. UPLOAD BUILD LOG
      # =========================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V5-BUILD-LOG
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 18. FIND ADMIN DASHBOARD
      # =========================================================
      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN_DIR=""

          if [ -d "extracted/admin-dashboard" ]; then
            ADMIN_DIR="extracted/admin-dashboard"
          fi

          if [ -z "$ADMIN_DIR" ]; then

            INDEX_FILE="$(
              find extracted \
                -type f \
                -name 'index.html' \
                | head -n 1
            )"

            if [ -n "$INDEX_FILE" ]; then
              ADMIN_DIR="$(dirname "$INDEX_FILE")"
            fi

          fi

          if [ -z "$ADMIN_DIR" ]; then

            echo "No Admin Dashboard found."

            echo "found=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "ADMIN:"
          echo "$ADMIN_DIR"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$ADMIN_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 19. PREPARE ADMIN
      # =========================================================
      - name: Prepare Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.path }}/." \
            public/

          echo "===== ADMIN FILES ====="

          find public \
            -maxdepth 5 \
            -type f \
            | sort

      # =========================================================
      # 20. DEPLOY ADMIN
      # =========================================================
      - name: Deploy Admin Dashboard
        if: success() && steps.admin.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy SADEE X DIMA V5 Admin"

      # =========================================================
      # 21. SUCCESS
      # =========================================================
      - name: Build Complete
        if: success()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "      SADEE X DIMA V5 SUCCESS"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "SADEE-X-DIMA-V5-APK"
          echo ""
          echo "Admin:"
          echo "gh-pages"
          echo ""
          echo "BUILD COMPLETE"
